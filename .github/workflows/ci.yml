name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # DESIGN.md §7: regenerating with a different CLI silently changes what
  # the grammar accepts, so the pin is load-bearing rather than hygiene.
  # It matches the tree-sitter runtime library consumers link, so a query
  # that validates here cannot be an impossible pattern there.
  TREE_SITTER_VERSION: "0.26.12"

jobs:
  workspace:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compiles every grammar's parser.c and scanner.c as a real crate,
      # and runs their load + manifest tests.
      - run: cargo build --workspace
      - run: cargo test --workspace

  grammars:
    name: gates (${{ matrix.grammar }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grammar: [python, rust, typescript, java]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install pinned tree-sitter CLI
        run: cargo install tree-sitter-cli --version "$TREE_SITTER_VERSION" --locked

      - run: cargo build -p treebank-cli

      # I1 — reproducible generation. The committed src/ must be exactly
      # what grammar.js produces at the pinned CLI; without this the
      # published parser and the readable grammar can drift apart.
      - name: generation is reproducible
        working-directory: crates/treebank-${{ matrix.grammar }}
        run: |
          tree-sitter generate
          if ! git diff --quiet -- src/; then
            echo "::error::src/ is not what grammar.js generates at $TREE_SITTER_VERSION"
            git diff --stat -- src/
            exit 1
          fi

      # The grammar's own corpus tests: tree shapes, not just accept/reject.
      - name: corpus tests
        working-directory: crates/treebank-${{ matrix.grammar }}
        run: tree-sitter test

      # Sweeps catch rejects-valid-code. This catches accepts-invalid-code,
      # the direction that optimizing a pass rate drifts toward and that no
      # corpus of real (valid) source can ever reveal.
      - name: negative corpus
        run: ./target/debug/treebank negative
          --grammar crates/treebank-${{ matrix.grammar }}
          --dir crates/treebank-${{ matrix.grammar }}/test/negative

      # I4 — vocabulary conformance: closed term lists, total node
      # coverage, containments, and a roles.json whose members all exist.
      - name: vocabulary conformance
        run: ./target/debug/treebank roles crates/treebank-${{ matrix.grammar }}

      # Sweeps and the negative corpus both judge accept/reject. This judges
      # the TREE: every node boundary the reference parser reports must
      # exist in ours. It is the only check here that can see a file parse
      # cleanly and wrongly, and every fixture under test/shape/ is a
      # mis-parse that was found on the corpus and fixed. Ceiling is zero.
      #
      # The full corpus run is `treebank shape --lang typescript` locally;
      # CI has no corpus, so it guards the fixtures.
      - name: shape (tree agrees with the reference parser)
        # java has no span oracle yet: javac can report node boundaries
        # through Trees.getSourcePositions(), but that oracle is not built,
        # and `shape` says so and exits rather than comparing against
        # nothing.
        if: matrix.grammar != 'java'
        run: ./target/debug/treebank shape
          --lang ${{ matrix.grammar }}
          --grammar crates/treebank-${{ matrix.grammar }}
          --dir crates/treebank-${{ matrix.grammar }}/test/shape
          --out /tmp/shape-fixture.json

  rosetta:
    name: gates (cross-language rosetta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p treebank-cli
      # The one check that catches a role threaded in one grammar and
      # forgotten in another: supertype matching is derivation-based, so a
      # missed thread is silent everywhere else.
      - run: ./target/debug/treebank rosetta

  wasm:
    name: wasm packs (${{ matrix.grammar }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # java is not in the wasm matrix yet: the pack build has not been
        # exercised for it, and claiming a published artifact that has never
        # been built is worse than shipping one language later.
        grammar: [python, rust, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The toolchain (wasi-sdk, binaryen) and the tree-sitter runtime are
      # downloaded, sha256-verified and cached — never taken from PATH, so a
      # runner with its own compilers cannot change the bytes.
      - name: cache wasm toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/treebank
          key: wasm-toolchain-${{ runner.os }}-${{ hashFiles('tools/wasm-pack/toolchain.sh') }}
      - run: pip install wasmtime
      # DESIGN.md §7 makes wasm a first-class artifact, so packs are built
      # and checked on every change rather than at release time: a grammar
      # that cannot cross to wasm should fail here, not in a consumer's
      # browser. check.sh also asserts byte-reproducibility, that a real
      # WASI runtime loads the module, and that what the pack says about
      # itself matches the repo.
      - name: build and check the pack
        run: ./tools/wasm-pack/check.sh ${{ matrix.grammar }}
      - uses: actions/upload-artifact@v4
        with:
          name: treebank-${{ matrix.grammar }}-wasm-pack
          path: dist/wasm/treebank-${{ matrix.grammar }}.wasm

  release-rehearsal:
    name: wasm release rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the rehearsal reads and writes tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: cache wasm toolchain
        uses: actions/cache@v4
        with:
          path: ~/.cache/treebank
          key: wasm-toolchain-${{ runner.os }}-${{ hashFiles('tools/wasm-pack/toolchain.sh') }}
      - run: pip install wasmtime
      # Everything that only happens AFTER a successful release — the tag,
      # the skip on a re-run, and a consumer fetching assets over HTTP and
      # parsing with them — is untestable by publishing, which is exactly
      # the part that breaks. This rehearses all of it and publishes
      # nothing: staged releases, served over localhost, fetched by URL,
      # checksummed, parsed by both example consumers, and indexed.
      - run: ./tools/wasm-pack/test-release.sh
