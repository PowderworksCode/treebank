name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # DESIGN.md §7: regenerating with a different CLI silently changes what
  # the grammar accepts, so the pin is load-bearing rather than hygiene.
  # It matches the tree-sitter runtime library consumers link, so a query
  # that validates here cannot be an impossible pattern there.
  TREE_SITTER_VERSION: "0.26.12"

jobs:
  workspace:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Compiles every grammar's parser.c and scanner.c as a real crate,
      # and runs their load + manifest tests.
      - run: cargo build --workspace
      # One generated inventory joins registry configuration, ledgers,
      # fixtures, policies, locks and canaries. --check makes missing or
      # contradictory required configuration fail; warnings remain visible
      # in the run summary without pretending optional coverage is broken.
      - name: repository status
        run: |
          ./target/debug/treebank status --format markdown --check > "$RUNNER_TEMP/treebank-status.md"
          cat "$RUNNER_TEMP/treebank-status.md" >> "$GITHUB_STEP_SUMMARY"
      - run: cargo test --workspace

      # The publish path runs on every change, uploading nothing. Otherwise it
      # is first exercised by the tag that publishes, which is the one moment
      # a mistake cannot be taken back.
      - run: ./tools/publish-crate.sh --dry-run

      # The site publishes a snapshot of the inventory above, because
      # Cloudflare Workers Build has no Rust toolchain and cannot produce one
      # at deploy time. Regenerating it here and failing on a difference is
      # what stops treebank.dev from quoting pass rates, gap counts and
      # evidence freshness that this repository has stopped agreeing with --
      # the same guard the corpus ledgers get, for the same reason.
      #
      # `git status --porcelain`, not `git diff`: diff reports only tracked
      # files, so a snapshot that went missing from the index would make this
      # check pass by having nothing to compare.
      - name: the site's inventory snapshot is current
        run: |
          node site/tools/build-status.mjs
          if [ -n "$(git status --porcelain -- site/public/status.json)" ]; then
            echo "::error::site/public/status.json is stale or untracked; run 'bun run status' in site/"
            git diff -- site/public/status.json | head -40
            exit 1
          fi

  # The grammar and sweep lists, read off the repository rather than written down.
  # A hand-maintained matrix means a new grammar's gates are green because
  # nothing ran them, which is the one failure mode a gate cannot survive.
  # A directory under crates/ with a grammar.js in it IS a grammar.
  discover:
    name: discover grammars
    runs-on: ubuntu-latest
    outputs:
      grammars: ${{ steps.list.outputs.grammars }}
      languages: ${{ steps.list.outputs.languages }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: list
        run: |
          set -euo pipefail
          list=$(./tools/wasm-pack/list-grammars.sh | jq -R . | jq -sc .)
          echo "grammars=$list" >> "$GITHUB_OUTPUT"
          echo "gating: $list"
          languages=$(find test/sweep-smoke -mindepth 1 -maxdepth 1 -type d \
            -exec basename {} \; | sort | jq -R . | jq -sc .)
          echo "languages=$languages" >> "$GITHUB_OUTPUT"
          echo "sweeping: $languages"

  sweeps:
    name: sweep smoke (${{ matrix.language }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.discover.outputs.languages) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.language == 'typescript' || matrix.language == 'javascript'
        with:
          node-version: "22"
      - name: install TypeScript oracle dependencies
        if: matrix.language == 'typescript'
        working-directory: crates/treebank-oracle/tools/ts-oracle
        run: npm ci --no-audit --no-fund
      - name: install JavaScript oracle dependencies
        if: matrix.language == 'javascript'
        working-directory: crates/treebank-oracle/tools/js-oracle
        run: npm ci --no-audit --no-fund

      # Python and Zig grammars cover historical syntax too. Their legacy
      # oracle legs are mandatory: omitting one would mislabel old-version
      # syntax as noise and make a broken sweep look healthier.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.language == 'python'
        with:
          # setup-python no longer publishes CPython 2 builds. PyPy's 2.7
          # parser drives only this two-file plumbing smoke; production
          # evidence continues to use the CPython 2.7 oracle named in the ledger.
          python-version: "pypy-2.7"
      - name: expose Python 2 under the oracle's pinned name
        if: matrix.language == 'python'
        run: |
          ln -s "$(command -v python)" "$RUNNER_TEMP/python2"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        if: matrix.language == 'ruby'
        with:
          ruby-version: "3.3.6"

      - name: install libclang oracle
        if: matrix.language == 'c' || matrix.language == 'cpp'
        run: sudo apt-get update -qq && sudo apt-get install -y libclang-dev

      - uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c # v2
        if: matrix.language == 'zig'
        with:
          version: 0.11.0
          cache-key: sweep-smoke-legacy
      - name: preserve the legacy Zig oracle
        if: matrix.language == 'zig'
        run: |
          legacy=$(command -v zig)
          printf '#!/usr/bin/env bash\nexec %q "$@"\n' "$legacy" > "$RUNNER_TEMP/zig-0.11"
          chmod +x "$RUNNER_TEMP/zig-0.11"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c # v2
        if: matrix.language == 'zig'
        with:
          version: 0.16.0
          cache-key: sweep-smoke-current

      - run: cargo build -p treebank-cli
      # Each checked-in micro-corpus has one valid and one invalid file. The
      # latter must be rejected by both Treebank and the reference parser,
      # proving the language-specific oracle path rather than only parsing.
      - run: ./tools/sweep-smoke.sh ${{ matrix.language }}

  grammars:
    name: gates (${{ matrix.grammar }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.discover.outputs.grammars) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: install pinned tree-sitter CLI
        run: cargo install tree-sitter-cli --version "$TREE_SITTER_VERSION" --locked

      - run: cargo build -p treebank-cli

      # I1 — reproducible generation. The committed src/ must be exactly
      # what grammar.js produces at the pinned CLI; without this the
      # published parser and the readable grammar can drift apart.
      - name: generation is reproducible
        working-directory: crates/treebank-${{ matrix.grammar }}
        run: |
          tree-sitter generate
          if ! git diff --quiet -- src/; then
            echo "::error::src/ is not what grammar.js generates at $TREE_SITTER_VERSION"
            git diff --stat -- src/
            exit 1
          fi

      # The grammar's own corpus tests: tree shapes, not just accept/reject.
      - name: corpus tests
        working-directory: crates/treebank-${{ matrix.grammar }}
        run: tree-sitter test

      # Sweeps catch rejects-valid-code. This catches accepts-invalid-code,
      # the direction that optimizing a pass rate drifts toward and that no
      # corpus of real (valid) source can ever reveal.
      - name: negative corpus
        run: ./target/debug/treebank negative
          --grammar crates/treebank-${{ matrix.grammar }}
          --dir crates/treebank-${{ matrix.grammar }}/test/negative

      # I4 — vocabulary conformance: closed term lists, total node
      # coverage, containments, and a roles.json whose members all exist.
      - name: vocabulary conformance
        run: ./target/debug/treebank roles crates/treebank-${{ matrix.grammar }}

      # The FIELD_GUIDE.md smell detector: declared-conflict growth, early
      # commits between parallel tiers, same-text token splits, unreserved
      # keywords, scanner/externals drift, parse-table growth. Enforced
      # against the grammar's lint_policy.toml ratchets where one exists;
      # advisory (report only) where none does yet.
      - name: grammar lint
        run: ./target/debug/treebank lint crates/treebank-${{ matrix.grammar }}

      # Sweeps and the negative corpus both judge accept/reject. This judges
      # the TREE: every node boundary the reference parser reports must
      # exist in ours. It is the only check here that can see a file parse
      # cleanly and wrongly, and every fixture under test/shape/ is either a
      # mis-parse that was found on the corpus and fixed, or a construct
      # family nothing else was pinning. Ceiling is zero.
      #
      # The full corpus run is `treebank shape --lang typescript` locally;
      # CI has no corpus, so it guards the fixtures.
      # Whether there is anything to guard is a property of the checkout,
      # not a list of exceptions: C, C++ and java have a span oracle and
      # fixtures and run here; bash has the oracle but no fixtures yet; zig
      # has no span oracle because its toolchain exposes formatting and a
      # verdict, not a supported tree dump. Any grammar currently without
      # fixtures starts running this step the day its first one lands.
      - name: are there shape fixtures
        id: fixtures
        run: |
          if [ -d "crates/treebank-${{ matrix.grammar }}/test/shape" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "no crates/treebank-${{ matrix.grammar }}/test/shape; nothing to guard"
          fi

      - name: install libclang span oracle
        if: steps.fixtures.outputs.have == 'true' && (matrix.grammar == 'c' || matrix.grammar == 'cpp')
        run: sudo apt-get update -qq && sudo apt-get install -y libclang-dev

      # The java span oracle is javac's own parser through the single-file
      # source launcher, so this job needs the same JDK the `sweeps` job
      # pins and the ledger names. The runner image ships a JDK, but which
      # one is not ours to depend on: the fixtures use record patterns and
      # pattern switches, which a JDK older than 21 rejects outright.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.fixtures.outputs.have == 'true' && matrix.grammar == 'java'
        with:
          distribution: temurin
          java-version: "21"

      - name: shape (tree agrees with the reference parser)
        if: steps.fixtures.outputs.have == 'true'
        run: ./target/debug/treebank shape
          --lang ${{ matrix.grammar }}
          --grammar crates/treebank-${{ matrix.grammar }}
          --dir crates/treebank-${{ matrix.grammar }}/test/shape
          --out /tmp/shape-fixture.json

  rosetta:
    name: gates (cross-language rosetta)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build -p treebank-cli
      # The one check that catches a role threaded in one grammar and
      # forgotten in another: supertype matching is derivation-based, so a
      # missed thread is silent everywhere else.
      - run: ./target/debug/treebank rosetta

  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: install
        working-directory: site
        run: bun install --frozen-lockfile

      # The build derives the reference pages and their data from crates/ --
      # a directory with a grammar.js in it is a grammar, the same rule the
      # gates above are matrixed from. So this fails if a grammar has arrived
      # without a page, rather than publishing a site that quietly documents
      # eight of nine.
      - name: build
        working-directory: site
        run: bun run build

      # The fold is total over grammar.json's node kinds and throws on one it
      # does not know. Running it over every rule of every grammar is what
      # stops a new DSL construct from silently dropping part of a production
      # from its documentation -- invisible in the output, because the rule
      # still renders, just not all of it.
      - name: test
        working-directory: site
        run: bun test

  wasm:
    name: wasm packs (${{ matrix.grammar }})
    runs-on: ubuntu-latest
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        # The same discovery that drives the grammar gates drives release
        # artifacts. Adding grammar.js therefore cannot quietly ship a
        # native-only grammar while every visible CI job stays green.
        grammar: ${{ fromJSON(needs.discover.outputs.grammars) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The toolchain (wasi-sdk, binaryen) and the tree-sitter runtime are
      # downloaded, sha256-verified and cached — never taken from PATH, so a
      # runner with its own compilers cannot change the bytes.
      - name: cache wasm toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/treebank
          key: wasm-toolchain-${{ runner.os }}-${{ hashFiles('tools/wasm-pack/toolchain.sh') }}
      - run: pip install wasmtime
      # DESIGN.md §7 makes wasm a first-class artifact, so packs are built
      # and checked on every change rather than at release time: a grammar
      # that cannot cross to wasm should fail here, not in a consumer's
      # browser. check.sh also asserts byte-reproducibility, that a real
      # WASI runtime loads the module, and that what the pack says about
      # itself matches the repo.
      - name: build and check the pack
        run: ./tools/wasm-pack/check.sh ${{ matrix.grammar }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: treebank-${{ matrix.grammar }}-wasm-pack
          path: dist/wasm/treebank-${{ matrix.grammar }}.wasm

  # The packs the playground loads, content-addressed.
  #
  # They are build artifacts -- 14 MB, rebuilt whenever a grammar changes --
  # so they live in R2 rather than in git or in a release. Release assets
  # could not work anyway: they carry no access-control-allow-origin, on
  # either the github.com redirect or the final object, so a browser is
  # refused. R2 makes the rest unremarkable, with free egress and 14 MB
  # against a 10 GB free tier.
  #
  # The bytes uploaded are the ones the wasm gate above already built and
  # checked, downloaded rather than rebuilt, so what the site serves is
  # exactly what was verified.
  #
  # Only on main, and only where the credentials are configured: a fork's
  # pull request has no secrets and must not fail for the lack of them.
  packs:
    name: publish wasm packs
    runs-on: ubuntu-latest
    needs: [wasm]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: treebank-*-wasm-pack
          merge-multiple: true
          path: site/public/packs

      # Same script the local build uses, so the keys and the manifest cannot
      # be one thing here and another on a laptop.
      - name: content-address them
        working-directory: site
        run: bun run packs

      # Uploaded over the S3 API with a BUCKET-SCOPED R2 token, not over
      # wrangler's REST endpoint with an account token.
      #
      # That is a deliberate narrowing, and it is also the only one that
      # works: a token scoped to this bucket with Workers R2 Storage Bucket
      # Item read+write is refused by wrangler's objects endpoint with a
      # 403 "Authentication error", and Cloudflare's documentation does not
      # say which permission group that endpoint wants. The S3 API is what a
      # bucket-scoped token is for, and it is a documented interface rather
      # than an inferred one.
      #
      # Scope is worth the second secret here: this credential can write
      # WebAssembly that executes in visitors' browsers, and nothing else.
      - name: upload to R2
        working-directory: site
        env:
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # aws-cli v2 adds CRC32 request checksums by default, which R2
          # rejects. Off, or every put fails on something unrelated to us.
          AWS_REQUEST_CHECKSUM_CALCULATION: WHEN_REQUIRED
          AWS_RESPONSE_CHECKSUM_VALIDATION: WHEN_REQUIRED
        run: |
          set -euo pipefail
          if [ -z "${R2_ACCOUNT_ID:-}" ] && [ -z "${AWS_ACCESS_KEY_ID:-}" ] \
             && [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::notice::R2 is not configured; packs were built and checked but not published"
            exit 0
          fi
          if [ -z "${R2_ACCOUNT_ID:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] \
             || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::error::R2 is half configured. Needs CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY."
            exit 1
          fi
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          put() {
            aws s3api put-object --endpoint-url "$endpoint" \
              --bucket treebank-packs --key "$1" --body "$2" \
              --content-type "$3" >/dev/null
          }

          # Hashed objects first, manifest last. The manifest is the pointer,
          # so publishing it before the objects it names would leave the site
          # briefly resolving to something that is not there yet. Old hashed
          # objects are never deleted -- that is what keeps a pinned link
          # working, and it costs a few megabytes.
          for f in public/packs/treebank-*-*.wasm; do
            put "$(basename "$f")" "$f" application/wasm
            echo "  put $(basename "$f")"
          done
          put index.json public/packs/index.json application/json
          echo "  put index.json"

          # Read back what was written. A publish that reports success and
          # leaves the bucket empty is the failure this whole job exists to
          # avoid, and it is cheap to rule out.
          checked=0
          for f in public/packs/treebank-*-*.wasm; do
            key=$(basename "$f")
            remote=$(aws s3api head-object --endpoint-url "$endpoint" \
              --bucket treebank-packs --key "$key" --query ContentLength --output text)
            local_size=$(stat -c%s "$f")
            [ "$remote" = "$local_size" ] \
              || { echo "::error::$key is $remote bytes in the bucket, $local_size locally"; exit 1; }
            checked=$((checked + 1))
          done
          aws s3api head-object --endpoint-url "$endpoint" \
            --bucket treebank-packs --key index.json >/dev/null \
            || { echo "::error::index.json is not in the bucket"; exit 1; }
          echo "verified $checked packs and the manifest in the bucket"

  consumers:
    name: wasm consumers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: cache wasm toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/treebank
          key: wasm-toolchain-${{ runner.os }}-${{ hashFiles('tools/wasm-pack/toolchain.sh') }}
      - run: pip install wasmtime
      # check.sh proves a pack loads under a WASI runtime. This proves the ABI
      # is usable: every pack fetched over HTTP -- as the site fetches them
      # from R2 -- checksummed against the bytes that travelled, then driven
      # by both example bindings, asserting the sweep-smoke valid fixture
      # parses clean and the invalid one is still rejected. Those bindings are
      # also the reference the browser's was ported from, so if they break the
      # playground breaks with them.
      - run: ./tools/wasm-pack/test-consumers.sh
