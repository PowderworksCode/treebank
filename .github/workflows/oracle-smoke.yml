# The one oracle property no other check can see.
#
# verify-grammars.yml runs the ledger, materialize, `tree-sitter test` and the
# negative corpus, per grammar. None of that invokes an oracle. So the class of
# bug fixed in "oracles: an unreadable file is not an invalid file" — an oracle
# answering `invalid` for a file it could not read, which records every grammar
# failure as corpus noise, drives gap_files to zero and reports a flawless
# grammar — is invisible to every check in the repository. It was found by hand
# and could come back the same way.
#
# This is deliberately a separate workflow rather than a job in
# verify-grammars.yml: that workflow's matrix is derived from which GRAMMARS a
# change concerns, and this concerns all of them at once.
#
# The trigger paths matter as much as the script. An earlier version watched
# only `tools/**`, which cannot see the oracle that had the bug longest:
# rust's is `syn` in-process, it lives in crates/treebank-cli/src/lang/rust.rs,
# and no change to it would have run this check. The paths below follow what
# the script actually reads — every ledger, every Lang impl, and the CLI that
# drives them.
#
# The runtimes are installed explicitly and the script is run with
# --require-all, so a missing toolchain fails the job instead of quietly
# skipping the oracle it would have tested. A guard that can silently test
# nothing is worse than no guard.
name: oracle-smoke

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'crates/*/ledger.json'
      - 'crates/treebank-cli/src/**'
      - 'scripts/oracle-smoke.sh'
      - '.github/workflows/oracle-smoke.yml'
  pull_request:
    # Duplicated rather than a YAML anchor: Actions' support for anchors is
    # not dependable, and a trigger that silently stops matching is the exact
    # failure this workflow exists to catch.
    paths:
      - 'tools/**'
      - 'crates/*/ledger.json'
      - 'crates/treebank-cli/src/**'
      - 'scripts/oracle-smoke.sh'
      - '.github/workflows/oracle-smoke.yml'

concurrency:
  group: oracle-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install lua5.4
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.4

      # PHP from ondrej's PPA, not the distro package. treebank-php's oracle
      # enforces a MEASURED floor of 8.4: on 1703 files from the top 40
      # Packagist packages, PHP 8.3 rejects 7, every one of them current
      # Symfony using property hooks and asymmetric visibility. Running an
      # older PHP would score valid 8.4+ code as invalid, which files real
      # grammar gaps as corpus noise. ubuntu-latest ships 8.3, so the distro
      # package is below the floor and the oracle refuses to run on it --
      # which is how this step came to exist: the smoke test caught it.
      - name: Install PHP 8.4
        run: |
          set -euo pipefail
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update -qq
          sudo apt-get install -y -qq php8.4-cli
          php8.4 --version | head -1

      # Zig is pinned to the version treebank-zig's ledger names, and unlike
      # libclang below that is NOT a formality. For Zig the compiler version
      # IS the language version — measured, 801 of 11,672 corpus files change
      # verdict across 0.11 to 0.16 — so that grammar's oracle refuses to
      # resolve `zig` from PATH at all and takes its binary from
      # TREEBANK_ZIG_ORACLE. Building the smoke binary with "whatever zig the
      # runner has" would be the exact mistake the field exists to prevent,
      # in the check that is supposed to guard it.
      - name: Install Zig 0.16.0 and build the oracle
        run: |
          set -euo pipefail
          ver=0.16.0
          curl -sSL "https://ziglang.org/download/$ver/zig-x86_64-linux-$ver.tar.xz" | tar xJ
          tools/zig-oracle/build.sh "$PWD/zig-x86_64-linux-$ver/zig"
          echo "TREEBANK_ZIG_ORACLE=$PWD/tools/zig-oracle/check-$ver" >> "$GITHUB_ENV"

      # libclang for c-oracle. The version is deliberately NOT pinned to the
      # one in treebank-c's ledger: that pin is load-bearing for VERDICTS on
      # real corpus files, and this test only asserts plumbing — that a
      # missing file is fatal, and that the two fixtures the ledger names
      # still come back valid and invalid. Any libclang can answer that, and
      # c's ledger — unlike zig's — does not forbid resolving the tool
      # loosely.
      - name: Install libclang
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm-dev libclang-dev
          echo "TREEBANK_LLVM_DIR=$(llvm-config --prefix)" >> "$GITHUB_ENV"

      # The BEAM, for elixir-oracle. Deliberately this repo's own pinned
      # installer rather than erlef/setup-beam: it fetches from the same host
      # that action does (builds.hex.pm), verifies checksums, and installs the
      # exact OTP and Elixir that crates/treebank-elixir's ledger names — so
      # CI and a laptop adjudicate with the same parser. `--otp-only` is the
      # half the erlang oracle will need when it lands.
      - name: Install the BEAM toolchain
        run: |
          set -euo pipefail
          IFS=: read -r otp_bin elixir_bin < <(tools/beam-toolchain/fetch.sh)
          echo "$otp_bin" >> "$GITHUB_PATH"
          echo "$elixir_bin" >> "$GITHUB_PATH"
          echo "TREEBANK_ELIXIR=$elixir_bin/elixir" >> "$GITHUB_ENV"
      # The script drives `treebank oracle`, the single entry point every
      # oracle is reached through, so the binary is a prerequisite.
      - name: Build treebank
        run: cargo build --release

      - name: Oracle smoke test
        run: scripts/oracle-smoke.sh --require-all
