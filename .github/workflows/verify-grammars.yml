# Materialization invariant, per grammar:
#
#   upstream/ submodule checked out exactly at the ledger's pinned sha
#   + patches/ applied in order
#   (+ npm ci where generation has js deps)
#   + tree-sitter generate with the ledger's pinned CLI version
#   -> build/ (gitignored), which must pass the grammar's corpus tests and
#      reject every file in our negative corpus.
#
# scripts/verify.sh implements this generically (via scripts/materialize.sh),
# reading everything grammar-specific from the grammar's ledger.json, so CI
# is just: build the treebank CLI once, run the verify script per grammar.
#
# Two things are shaped by a hundred grammars rather than five, both measured
# in ROADMAP.md:
#
#   - The CLI is built in its own job and downloaded as an artifact. It was
#     built identically inside every matrix job, and verify.sh only needs the
#     binary — no cargo, so the matrix jobs carry no Rust toolchain at all.
#   - Checkout takes no submodules. materialize.sh initializes the single one
#     it needs, so a job fetches one upstream grammar repo instead of all of
#     them: 2.3 s and 13 MB per grammar, previously paid in every job, which
#     at 100 grammars is ~4 minutes and ~1.3 GB of checkout per job.
#
# Which grammars, though, is decided per change rather than fixed: the `changes`
# job runs scripts/changed-grammars.sh, and the verify matrix is built from its
# answer. A patch to one grammar verifies that grammar; a change to a core path
# — scripts/, treebank-cli, tools/, the workflows — puts all of them back in
# scope. publish-grammars.yml calls this workflow and reuses the same answer, so
# there is one definition of "which grammars does this change concern".
name: verify-grammars

on:
  # push only on the trunk. A branch's `pull_request` run already covers it,
  # and the push run cannot do better: on a branch's FIRST push there is no
  # previous tip to diff against, so it falls back to every grammar, and after
  # a force-push the before→after span covers whatever lies between two
  # divergent histories — which is every stacked PR, every time a lower layer
  # merges and the ones above it are rebased.
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'scripts/**'
      - 'tools/**'
      - '.gitmodules'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/verify-grammars.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'scripts/**'
      - 'tools/**'
      - '.gitmodules'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/verify-grammars.yml'
  # Callable so publish-grammars.yml can gate on this exact job rather than
  # keeping a second copy of it, and so it can reuse the same answer to "which
  # grammars does this change concern".
  workflow_call:
    outputs:
      grammars:
        description: JSON array of grammar dir names this change concerns.
        value: ${{ jobs.changes.outputs.grammars }}
      core:
        description: Whether a core path changed, putting every grammar in scope.
        value: ${{ jobs.changes.outputs.core }}

# One verification per ref; a later push supersedes an earlier one. Nothing
# here is irreversible, so cancelling in flight is safe — publish-grammars.yml
# deliberately sets the opposite policy for itself.
concurrency:
  group: verify-grammars-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which grammars does this change actually concern? Verifying all five for a
  # one-line patch to one of them is four wasted jobs, and the rule for deciding
  # lives in scripts/changed-grammars.sh (with a self-test) rather than in YAML.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      grammars: ${{ steps.pick.outputs.grammars }}
      core: ${{ steps.pick.outputs.core }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - id: pick
        env:
          # For a PR this is the base tip and the diff below is three-dot, so it
          # is measured from the merge base. For a push it is the previous tip.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # No usable base — a branch's first push, or a manual dispatch. Fall
          # back to every grammar: the safe direction is to check too much.
          if [ -z "${BASE:-}" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]              || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            out=$(scripts/changed-grammars.sh --all)
          else
            out=$(scripts/changed-grammars.sh "$BASE")
          fi
          echo "$out"
          echo "grammars=$(jq -c .grammars <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "core=$(jq -r .core <<<"$out")" >> "$GITHUB_OUTPUT"
          echo "### $(jq -r .reason <<<"$out")" >> "$GITHUB_STEP_SUMMARY"

  # Built once, not once per matrix job.
  build-cli:
    needs: changes
    if: needs.changes.outputs.grammars != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin treebank
      - uses: actions/upload-artifact@v4
        with:
          name: treebank-cli
          path: target/release/treebank
          retention-days: 1
          if-no-files-found: error

  verify:
    needs: [changes, build-cli]
    # An empty matrix is a workflow error, not a no-op, so guard it.
    if: needs.changes.outputs.grammars != '[]'
    runs-on: ubuntu-latest
    # Measured spread of verify.sh across the current grammars is 2.5 s (java)
    # to 50.8 s (typescript: two generate dirs plus npm ci) — 20x. This bounds
    # a runaway generate rather than discriminating between grammars, since
    # even the slowest is well under a minute. If one ever approaches this,
    # give ledger.json a timeout field instead of raising it for everyone.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # The org's plan allows 20 concurrent jobs across every repository. An
      # unbounded matrix would take all of them and queue the daily fix PRs
      # and any publish behind itself.
      max-parallel: 10
      matrix:
        grammar: ${{ fromJson(needs.changes.outputs.grammars) }}
    steps:
      # No submodules: materialize.sh initializes the single one it needs.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No Rust toolchain: verify.sh runs the prebuilt binary, npx and jq.
      - uses: actions/download-artifact@v4
        with:
          name: treebank-cli
          path: target/release
      - run: chmod +x target/release/treebank
      - name: Verify ${{ matrix.grammar }}
        run: scripts/verify.sh crates/${{ matrix.grammar }}

  # A single status check that is green whether the matrix ran one job, a
  # hundred, or none. A dynamic matrix cannot be named in branch protection,
  # and a skipped required check blocks a PR — so require this instead.
  verified:
    needs: [changes, verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          set -euo pipefail
          if [ "${{ needs.changes.result }}" != success ]; then
            echo "the changes job failed"; exit 1
          fi
          if [ "${{ needs.changes.outputs.grammars }}" = '[]' ]; then
            echo "no grammar concerned by this change — nothing to verify"; exit 0
          fi
          if [ "${{ needs.verify.result }}" != success ]; then
            echo "at least one grammar failed verification"; exit 1
          fi
          echo "verified: ${{ needs.changes.outputs.grammars }}"
