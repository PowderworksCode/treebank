name: corpus canary

on:
  workflow_dispatch:
  schedule:
    # Weekly, outside the per-change CI path: every job recreates one exact
    # locked corpus and parses every admitted file from scratch.
    - cron: "17 5 * * 1"

permissions:
  contents: read

env:
  # `deb.debian.org` is a redirector over several backends and they do not
  # always agree. Run 33218406274 failed the cpp leg twice in a row on
  # `gjs_1.89.2.orig.tar.xz` with a 404 from GitHub's runners, while the same
  # URL served the byte-identical file (sha256 c7d7a176…, 816,112 bytes,
  # matching the lock exactly) from elsewhere — so retrying the same host is
  # not a fix. snapshot.debian.org serves a fixed archive state instead.
  #
  # Only used as a SECOND try, and only for URLs under the Debian pool, so
  # this is inert for every other ecosystem. Nothing is trusted about the
  # mirror: each artifact's sha256 comes from the lock and is verified after
  # download, so a mirror serving the wrong bytes fails as a corrupt one does.
  TREEBANK_DEBIAN_SNAPSHOT: "https://snapshot.debian.org/archive/debian/20260824T000000Z"

concurrency:
  group: corpus-canary
  cancel-in-progress: false

jobs:
  sweep:
    name: ${{ matrix.language }} corpus evidence
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          # sweep_args are executable configuration, not status annotations:
          # treebank status finds these exact --lang declarations when it
          # reports canary coverage.
          - language: bash
            ledger: crates/treebank-bash/ledger.toml
            sweep_args: --lang bash --grammar crates/treebank-bash
          - language: c
            ledger: crates/treebank-c/ledger.toml
            sweep_args: --lang c --grammar crates/treebank-c
            # C's oracle is libclang, and its verdict is relative to an
            # include environment (see treebank-oracle/src/c.rs). Which
            # failures become `gap_files` and which become `noise_files`
            # therefore depends on the headers the machine has, not only on
            # the corpus and the grammar. Measured: this leg reproduces
            # 84,473/62,539/21,934/74.03% and both SHAs exactly, twice, while
            # `gap_files` reads 4,012 against a committed 6,392 — and the
            # rerun reproduced 4,012 bit for bit, so it is deterministic per
            # environment rather than flaky. Enforce what the inputs
            # determine; report the rest.
            evidence: reproducible
          - language: cpp
            ledger: crates/treebank-cpp/ledger.toml
            # Full C++ evidence is produced on the remote evidence host: the
            # 121,957-file run reaches ~16 GiB while adjudicating WebKit and
            # cannot fit a standard hosted runner. This deterministic spread
            # still exercises locked acquisition, parsing and libclang.
            sweep_args: --lang cpp --grammar crates/treebank-cpp --limit 2000 --no-write-ledger
          - language: java
            ledger: crates/treebank-java/ledger.toml
            sweep_args: --lang java --grammar crates/treebank-java
          - language: javascript
            ledger: crates/treebank-typescript/ledger.toml
            sweep_args: --lang javascript --grammar crates/treebank-typescript
          - language: python
            ledger: crates/treebank-python/ledger.toml
            sweep_args: --lang python --grammar crates/treebank-python
          - language: ruby
            ledger: crates/treebank-ruby/ledger.toml
            sweep_args: --lang ruby --grammar crates/treebank-ruby
          - language: rust
            ledger: crates/treebank-rust/ledger.toml
            sweep_args: --lang rust --grammar crates/treebank-rust
          - language: typescript
            ledger: crates/treebank-typescript/ledger.toml
            sweep_args: --lang typescript --grammar crates/treebank-typescript
          - language: yaml
            ledger: crates/treebank-yaml/ledger.toml
            sweep_args: --lang yaml --grammar crates/treebank-yaml
          - language: zig
            ledger: crates/treebank-zig/ledger.toml
            sweep_args: --lang zig --grammar crates/treebank-zig
          - language: hcl
            ledger: crates/treebank-hcl/ledger.toml
            sweep_args: --lang hcl --grammar crates/treebank-hcl

    steps:
      # Sweep provenance names the last commit that changed the generated
      # grammar inputs. A shallow checkout cannot answer that honestly.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.language == 'typescript' || matrix.language == 'javascript' || matrix.language == 'yaml'
        with:
          node-version: "22"
      - name: install TypeScript oracle dependencies
        if: matrix.language == 'typescript'
        working-directory: crates/treebank-oracle/tools/ts-oracle
        run: npm ci --no-audit --no-fund
      - name: install JavaScript oracle dependencies
        if: matrix.language == 'javascript'
        working-directory: crates/treebank-oracle/tools/js-oracle
        run: npm ci --no-audit --no-fund
      # YAML's oracle is a union of three legs and two implementations: the
      # spec-first parser at 1.2 and at 1.1, then the libyaml lineage. All
      # three are mandatory — a sweep missing one books files half the
      # installed base reads as noise.
      - name: install YAML oracle dependencies
        if: matrix.language == 'yaml'
        working-directory: crates/treebank-oracle/tools/yaml-oracle
        run: npm ci --no-audit --no-fund
      - name: install the libyaml half of the YAML oracle
        if: matrix.language == 'yaml'
        run: python3 -m pip install --quiet 'PyYAML==6.0.1'

      # Python and Zig are union grammars. Their legacy oracle legs are
      # mandatory: omitting one makes old-version syntax look like noise.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.language == 'python'
        with:
          python-version: "pypy-2.7"
      - name: expose Python 2 under the oracle's required name
        if: matrix.language == 'python'
        run: |
          ln -s "$(command -v python)" "$RUNNER_TEMP/python2"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: "21"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        if: matrix.language == 'ruby'
        with:
          ruby-version: "3.3.6"

      - name: install the evidence-pinned LLVM and libclang
        if: matrix.language == 'c' || matrix.language == 'cpp'
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: "21.1.8"
          directory: ${{ runner.temp }}/llvm-21.1.8
      - name: expose the pinned libclang to the oracle build
        if: matrix.language == 'c' || matrix.language == 'cpp'
        run: echo "TREEBANK_LLVM_DIR=$LLVM_PATH" >> "$GITHUB_ENV"

      # The HCL oracle is a Go program built against a pinned
      # hashicorp/hcl. Go pins the toolchain here so the version is a
      # recorded fact rather than whatever the runner image ships.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.language == 'hcl'
        with:
          go-version: "1.24"

      - uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c # v2
        if: matrix.language == 'zig'
        with:
          version: 0.11.0
          cache-key: corpus-canary-legacy
      - name: preserve the legacy Zig oracle
        if: matrix.language == 'zig'
        run: |
          legacy=$(command -v zig)
          printf '#!/usr/bin/env bash\nexec %q "$@"\n' "$legacy" > "$RUNNER_TEMP/zig-0.11"
          chmod +x "$RUNNER_TEMP/zig-0.11"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: step-security/setup-zig@1e9fbd457bcc3587b58845344a267f12f151709c # v2
        if: matrix.language == 'zig'
        with:
          version: 0.16.0
          cache-key: corpus-canary-current

      - run: cargo build -p treebank-cli

      - name: restore verified package archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: corpus/${{ matrix.language }}/cache
          key: ${{ matrix.language }}-corpus-${{ hashFiles(format('corpus-locks/{0}.json', matrix.language)) }}

      # A transient registry failure may interrupt a clean hydrate. Successful
      # archives are already digest-verified in the cache, so retrying resumes
      # safely; a corrupt archive or lock mismatch fails identically each time.
      - name: hydrate the exact locked corpus
        run: |
          for attempt in 1 2 3; do
            if ./target/debug/treebank hydrate --lang "${{ matrix.language }}"; then
              exit 0
            fi
            echo "hydrate attempt $attempt failed" >&2
            sleep $((attempt * 10))
          done
          exit 1

      - name: sweep and enforce the committed evidence
        run: |
          cp "${{ matrix.ledger }}" "$RUNNER_TEMP/ledger.committed"
          ./target/debug/treebank sweep ${{ matrix.sweep_args }} \
            --manifest "corpus/${{ matrix.language }}/manifest.json" \
            --out "corpus/${{ matrix.language }}/reports/sweep.json"
          if [ "${{ matrix.evidence }}" = "reproducible" ]; then
            # Enforces every field the corpus and grammar bytes determine and
            # reports the adjudication-derived ones. Restores the ledger after,
            # so the checkout stays clean for the artifact upload.
            python3 tools/canary-evidence.py \
              "$RUNNER_TEMP/ledger.committed" "${{ matrix.ledger }}"
            git checkout -- "${{ matrix.ledger }}"
          elif ! git diff --exit-code -- "${{ matrix.ledger }}"; then
            echo "::error::${{ matrix.language }} corpus evidence differs from the committed ledger"
            echo "Update the lock or grammar deliberately, rerun the full sweep, and review the new evidence."
            exit 1
          fi

      # The corpus is here and hydrated, which is the only place this can
      # be asked. Needs no per-language wiring in either direction: a
      # grammar with no [<lang>] section in kinds_policy.toml prints what
      # it found and exits clean, so it starts being GATED the day it
      # writes one, and `sweep_args` is reused verbatim because for every
      # full-corpus language it is exactly the --lang/--grammar pair.
      #
      # Skipped where the sweep above was sampled: `--check` refuses a
      # --limit run outright, because a sample's never-seen set is an
      # artefact of the sample and would declare blind spots that are not
      # blind.
      - name: hold the corpus blind spots to their policy
        if: ${{ !contains(matrix.sweep_args, '--limit') }}
        run: |
          ./target/debug/treebank kinds ${{ matrix.sweep_args }} --check \
            --out "corpus/${{ matrix.language }}/reports/kinds.json"

      - name: upload the corpus report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.language }}-corpus-report
          path: corpus/${{ matrix.language }}/reports/
          if-no-files-found: ignore
