[workspace]
# A glob, so a new crate is a member the moment its directory exists. The
# explicit list this replaced was a twelfth line to remember, with no
# decision in it: every directory under crates/ is a workspace member, and
# a grammar left out of the list would have been silently unbuilt and
# untested rather than loudly missing.
members = ["crates/*"]
resolver = "2"

# Corpus locks are hundreds of megabytes of content-addressed evidence. Keep
# `treebank status` interactive in ordinary debug builds while it verifies
# their SHA-256 identities.
[profile.dev.package.sha2]
opt-level = 3
