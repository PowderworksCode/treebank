# Cloudflare Workers config for the treebank docs site: plain files from
# powderworks-docs, served as a Worker over static assets. The worker exists
# for one job -- when an agent asks for a page with `Accept: text/markdown`,
# it serves that page's markdown twin (the index.md sitting beside each
# rendered page) instead of the HTML -- which is why `run_worker_first` is
# true: twins sit beside every page, so any path can negotiate. Workers Build
# settings are root directory `site`, build `bun run build`, deploy `bun run
# deploy`; both go through package.json so wrangler comes from the lockfile,
# where `npx wrangler` would fetch whatever is newest at deploy time.
name = "treebank"
main = "worker.ts"
compatibility_date = "2026-07-01"

[assets]
directory = "./out"
not_found_handling = "404-page"
binding = "ASSETS"

run_worker_first = true

# The wasm packs. Build artifacts, 14 MB across nine grammars and rebuilt
# whenever a grammar changes, so they are neither committed nor built here --
# CI puts them in the bucket and the Worker serves them same-origin.
#
# R2 is what makes this unremarkable: egress is free, and 14 MB is two
# thousandths of the free storage tier. The alternative that looked obvious --
# fetching the packs straight from GitHub releases -- cannot work at all, as
# release assets carry no access-control-allow-origin on either hop.
[[r2_buckets]]
binding = "PACKS"
bucket_name = "treebank-packs"
