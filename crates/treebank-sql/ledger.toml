# The grammar's evidence file: what it covers, what it is measured
# against, and every place it knowingly differs from the reference
# parser. Prose rather than data, which is why it is TOML.

language = 'sql'
versions = '''
SQL is the first target here whose "versions" (DESIGN.md §4.2) are DIALECTS rather than releases, and the union policy applies to them unchanged: one grammar accepts SQLite, PostgreSQL and MySQL, and a construct only one of them has is accepted everywhere. The shared core is SQL:2016's data-manipulation and data-definition syntax -- SELECT with CTEs, set operations, joins, window functions and FILTER; INSERT/UPDATE/DELETE with RETURNING; CREATE/ALTER/DROP for tables, views, indexes and schemas; transactions -- plus each dialect's cheap divergences: `REPLACE INTO`, `ON DUPLICATE KEY UPDATE`, backquoted identifiers and `#` comments from MySQL; `::` casts, `ARRAY[…]`, `DISTINCT FROM`, `FOR UPDATE` and `DELETE … USING` from PostgreSQL; `PRAGMA`, `OR REPLACE`-style conflict clauses and typeless columns from SQLite.

What is deliberately outside the union is the PROCEDURAL half: PL/pgSQL, Oracle PL/SQL and stored routine bodies. Those are a different language wearing SQL syntax -- they have their own statement grammar, their own control flow and their own delimiters -- and taking them on is a second grammar's worth of work, not a widening of this one. It is also why `_loop`, `_jump` and `_parameter` are not threaded: SQL as scoped here has no loop, no non-local transfer and no formal parameter list.

A TRIGGER IS NOT THAT, and this document said it was until the corpus disagreed. `CREATE TRIGGER … BEGIN stmt; stmt; END` in SQLite, MySQL's simple form and the standard is a plain statement list -- no control flow, no variables, no declarations -- and it is supported. What stays out is the routine BODY: PL/pgSQL's `DO $$ … $$` and a `CREATE FUNCTION` written in it. `test/negative/plpgsql-block.sql` and `test/negative/mysql-delimiter.sql` still pin that boundary.'''
generate_cli = '0.26.12'
vocabulary = '0.1.0'
roles_note = '''
15 of 22 table-tier terms are threaded, and every omission is a fact about the language rather than about the grammar.

`_loop`, `_jump` and `_parameter` are absent because the procedural half of SQL is out of scope (see `versions`); a `SELECT` repeats over rows, but nothing in its syntax is a loop. `_attribute` is absent because SQL annotates nothing. `_interpolation` is absent because a SQL string cannot embed an expression -- which is also what lets every `string` be a `_literal`, the test python's f-strings fail.

`_pattern` is absent for a reason worth stating, because SQL looks like it should have one: `LIKE 'a%'` and `SIMILAR TO` take patterns, but the pattern is an ordinary string literal with no syntax of its own -- the grammar cannot see inside it, and calling the string a `_pattern` would make `(_pattern)` mean "a string that happens to sit right of LIKE". The vocabulary's `_pattern` is a destructuring or matching POSITION in the syntax, and SQL has none.

`_modifier` is demoted to the facet tier; roles.json carries the reason. `_declaration` is NOT demoted, and the difference from java is instructive: java had to demote it because a field declaration and a local variable declaration are the same syntax in two positions, while SQL's declarations are the `CREATE` family and occur only at statement position. A column definition also introduces a name, but it lives in a table body and is reached as a `_member`, so the two never share a position.

`_callable` is the one facet omitted: nothing in scope defines something invokable. A `CREATE FUNCTION` body is the procedural language again, and a trigger is not invoked by name.'''

[corpus]
source = 'Debian sid sources, ranked by popcon installs, keeping every source package carrying at least 500 lines of SQL'
ranking_note = '''
SQL is a guest language and more completely so than shell: no package is written in SQL. It arrives as schema, migrations, seed data and test fixtures inside software written in something else, so the corpus question is bash's Debian question -- "which installed packages carry SQL" -- and not the registry question python, rust and typescript answer. There is no SQL registry to rank, and GitHub's `language:SQL` selects repositories that are MOSTLY SQL, which for a guest language is a small unrepresentative tail: dialect tutorials, interview-question repos and sample databases, not the migration directories where SQL lives.

popcon attributes installs to the PACKAGE, not to its SQL, so what this ranks is "SQL that ships inside software people install". That is the honest reading and it is not the same as "popular SQL". The population it selects is database engines and their test suites (postgresql-18 alone carries 130,141 lines), ORM and driver packages, web applications with a migration history, and a long tail of packages with one schema.sql -- so dialect is skewed toward whatever engine is shipping, which in Debian means postgres first.

Two blind spots, declared rather than filtered. Files that are `.sql` but are really TEMPLATES -- a `${schema}` or a `@table@` inside an otherwise ordinary script -- are in the corpus, because no cheap rule separates them from SQL that merely mentions a brace, and they will be counted as gaps. There is deliberately NO artifact-size cap, unlike bash: see `max_artifact_bytes` in treebank-corpus's sql.rs. A 250 MB cap was tried first, copied from bash, and it skipped five sources carrying 190,189 lines of SQL between them -- mysql-9.7 among them, at 87,855 lines and the only first-party MySQL available to a grammar whose whole claim is a dialect union. Artifact size is uncorrelated with how much SQL a package carries, so capping on it is sampling by download convenience.'''

[corpus.sweep]
files = 4854
packages = 41
passed = 1025
failed = 3829
gap_files = 48
noise_files = 3781
pass_rate = '21.1%'
note = '''
1,025 of 4,854 files parse; of the 3,829 that do not, SQLite rejects 3,781 as well, so the sweep found 48 adjudicated gaps and could say nothing at all about the rest.

That distance between 19.6% and "122 gaps" is the ONE-DIALECT ORACLE, and it is the number to read this ledger for. The corpus is dominated by engines' and browsers' own test suites -- virtuoso 1,127 files (23%), postgresql 806 (17%), chromium 646 (13%), postgis 499 (10%), qt6-webengine 424 (9%) -- and those files are written in the dialect of the thing that ships them. Chromium's and qt's are PerfettoSQL, a trace-query language with SQL's syntax and its own module system. SQLite rejects all of it, so it books as corpus noise whether or not the grammar was right to reject it too. A second oracle is not an improvement to this number; it is the only thing that can make it mean anything.

The pass rate FELL from 22.2% to 19.6% when the corpus grew, and that was the corpus getting more honest rather than the grammar getting worse: the five packages the artifact cap used to skip are browsers and a database engine, so they brought 1,360 files of the least standard SQL in Debian with them. Gaps found rose from 36 to 122 on the same change, which is what a corpus is for; three rounds of grinding then took them to 57, and fixing the oracle bug below took them to 48 by moving 9 files it should never have certified into noise. The rate is 21.1%.

WHAT IS LEFT is mostly not gettable, and saying which is the point of counting it. 18 of the 48 are PerfettoSQL and 12 are the optional comma between table members, both refused on purpose and both entered below. 2 are the reserved-word cost -- perfetto aliases a table `end`, which CASE needs. The rest is a tail of singletons, no two alike.
'''
grind = '''
Both ends of the grind are recorded. The first sweep, over the 36-package corpus, was 734 passed and 63 gaps. Seven fixes took it to 774/36: `DEFAULT '' NOT NULL` (a default is a literal position, not an expression position -- with a full expression the parser reads `'' NOT LIKE …` and never reaches the NOT NULL); `CREATE VIRTUAL TABLE … USING fts5(…)`; T-SQL's `[bracketed]` identifiers, which turned out not to collide with the array subscript because the lexer is state-aware; `ALTER TABLE … ADD CONSTRAINT`, now taking a `_member`; SQLite's `ON CONFLICT REPLACE`; a VALUES-seeded recursive CTE; and `timestamp(2) without time zone`. `SHOW` was added after the second sweep made it the largest single cluster at 72 occurrences.

THE THIRD GRIND, over the 41-package corpus, took 953/122 to 1,025/57 in three rounds. `WITHOUT ROWID` was the largest cluster at 56 files and is a table option that takes no value, so it needed no `=` to tell it from a following statement; `STRICT` and T-SQL's `ON [PRIMARY] TEXTIMAGE_ON [PRIMARY]` went in beside it, and the same node then closed the `CREATE INDEX … ON [PRIMARY]` cluster too. `GO`, T-SQL's batch separator, is accepted where `;` is. `ALTER TABLE … WITH NOCHECK`, `DROP TRIGGER`, and SQLite's postfix `x NOT NULL` and `x ISNULL` predicates followed.

`CREATE TRIGGER` is now supported, and the ledger was wrong to have ruled it out. It said the procedural half was out of scope and listed `CREATE TRIGGER … BEGIN … END` under it, which conflated two things: a PL/pgSQL routine body is a different language, but a SQLite or standard trigger body is a plain statement list -- no control flow, no variables, no declarations -- and belongs to a DDL grammar. Three clusters, 16 files. The body admits a RESTRICTED statement set, and that is what keeps it parseable: `commit_statement` is spelled `COMMIT` or `END`, so admitting every statement would make the `END` that closes the body indistinguishable from a transaction statement inside it.

The join fix is the subtle one. `INSERT INTO t (a, b) SELECT … JOIN u ON u.id = o.id` left the join's condition stranded outside the statement, because `prec.left` on `join_clause` made the reduce beat shifting the `ON` -- invisible in a plain SELECT, where the `ON` has nowhere else to go and recovery lands on the right tree anyway, and fatal here because the insert's own `ON CONFLICT` gives the reduce somewhere to go. `prec.right` fixes it and does NOT make joins nest right: `a JOIN b ON p JOIN c ON q` still comes out `((a JOIN b ON p) JOIN c ON q)`, because the recursion direction is decided by the fields.

Two smaller lessons from the same round. `NOT NULL` in expression position had to become ONE token, whitespace included, because as two it is ambiguous with everything else `NOT` starts there; and that token needed `prec(2)`, above the 1 every keyword carries, because tree-sitter's lexer compares precedence before length and the three-character `NOT` was beating the eight-character `NOT NULL`. `NOTNULL`, the one-word spelling, resisted the same treatment and was DROPPED rather than shipped unproven: 12 corpus occurrences, zero gap files, and a rule that cannot be demonstrated is worse than an absent one.

THE ONE WORTH READING is the mysql string escape, because of how it presented. `mysql_system_tables_data_fix.sql` -- 5.5 MB, 5,237 one-line REPLACE statements -- did not fail, it HUNG: over 45 seconds, while a 67 MB dump in the same package parsed in 10. Every hypothesis about why was wrong. It was not the declared `column_name_list`/`column_definition` conflict forking at each `INSERT INTO t (a, b)`: removing it left the time unchanged, and it was put back. It was not statement count, string length or file size: 200 copies of one of those statements parsed in 17 ms, 200 DIFFERENT ones took 854. It was one statement in the middle, carrying `UNIT["Clarke\'s link"]` -- a backslash-escaped apostrophe, which is MySQL's escape and not the standard's. The string token closed early, and the remaining 5 MB went through error recovery.

So the cost of a lexer that is wrong about one escape is not a rejected file. It is TIME, and it does not look like a lexer bug from the outside. 45,000 ms to 266 ms, and the file went from ERROR to a clean parse.

Two fixes were REJECTED on measurement, and both are the same shape -- a form one dialect allows, costing an ambiguity in a position every file uses. MySQL's `) ENGINE InnoDB` without the `=` made `name value` match any two words, so a `CREATE TABLE …)` followed by an unterminated `alter table foo add` -- openldap's mssql scripts, which separate on `GO` rather than `;` -- had its next statement eaten as an option. And SQLite's optional comma between table constraints (`PRIMARY KEY(a, b) FOREIGN KEY(c)`, 10 occurrences in chromium's generated schemas) makes `a CONSTRAINT …` both a column with a named constraint and a column followed by a table constraint, at every column of every CREATE TABLE.
'''
composition = '''
41 packages, 4,854 files, 167 MB, from a walk of the top 6,000 popcon sources; every source the walk found carrying >= 500 lines of SQL is in it. Largest contributors: virtuoso-opensource 1,127 files, postgresql-18 806, chromium 646, postgis 499, qt6-webengine 424, mysql-9.7 213, roundcube 152.

The walk was bounded at 6,000 popcon entries rather than run to exhaustion, so this is "SQL inside the 6,000 most-installed Debian sources", not "SQL inside Debian". A longer walk is more packages, not different ones.
'''
methodology_note = '''
The ranking and fetch were run with the methodology `treebank_corpus::debian` implements -- popcon order, sources.debian.org's sloc census, the >= 500-line floor, one leading path component stripped -- but through curl rather than through the crate, because the machine reaches deb.debian.org and popcon.debian.org only via a TLS-terminating proxy whose CA `ureq` (which bundles its own root store) does not see. The sweep itself, the oracle and the report are the real ones: `treebank sweep --lang sql --grammar crates/treebank-sql` over the manifest that produced. Anyone re-running this on a machine with ordinary network access should use `treebank rank --lang sql` and `treebank fetch --lang sql` and expect the same corpus.
'''

[[oracles]]
family = 'sqlite'
tool = 'SQLite via python3 -m sqlite3, through tools/sql-oracle/check.py'
version = 'SQLite 3.45.1 (the version bundled with the CPython running the oracle)'
role = '''
primary and only, and the "only" is the ceiling on what a SQL sweep can mean. Statements are split with `sqlite3.complete_statement` (sqlite3_complete, which knows that the `;` inside a trigger body does not end a statement) and each is prepared under `EXPLAIN`, which compiles it to a VDBE program and returns the listing instead of running it -- so no corpus file ever executes.

The syntax/semantics line is drawn on the ERROR MESSAGE rather than the error class, because preparing resolves names: `SELECT * FROM t` against an empty database fails with "no such table", and a file that is perfectly good SQL must not be booked as noise for it. SQLite's parser emits a short closed set of messages (near "X": syntax error / unrecognized token / incomplete input / parser stack overflow); everything else it can say is about a schema this oracle deliberately does not have.

A BUG THIS ORACLE HAD, kept because it is the failure mode nobody looks for. `sqlite3_complete` is purely LEXICAL -- it finds a `;` outside strings, comments and BEGIN…END -- so a script that separates statements some other way, T-SQL's `GO` or no separator at all, arrives as ONE fragment holding many statements, and `sqlite3_prepare` reads only the first. When that first statement failed on a NAME, the oracle answered `valid` for a file sqlite had never finished reading.

Note which direction that runs. The docstring's warning, and every other oracle's, is about answering `invalid` too readily: that books real gaps as noise and reports a flawless grammar. This was the mirror image -- it MANUFACTURED gaps, certifying files the oracle had no standing to certify, and 9 of 57 reported gaps turned out to be it. Both directions are wrong; only one of them is the one people watch for.

The rule now: a fragment sqlite did not terminate must PREPARE CLEANLY to count as valid, because that is the only case where sqlite demonstrably consumed all of it. A multi-statement warning means it was several; a name error on such a fragment is ambiguous -- one statement with an unresolvable name, or the first of several, and nothing here can tell -- and both answer invalid. Measured cost: 30 files across the corpus flip from valid to noise, which hides whatever gaps they carry. That is the safe direction. A `;`-terminated statement is untouched.

THE LIMIT: this is a one-dialect oracle for a dialect-union grammar. PostgreSQL's parser lives inside the server or inside libpg_query (a C library to build) and MySQL's inside mysqld; SQLite's is the only one reachable with nothing installed. So postgres-only and mysql-only syntax is never contradicted, and a file that fails BOTH the grammar and SQLite is booked as corpus noise rather than as the gap it may be. That direction is the safe one -- the sweep can miss a grammar bug, it can never invent one -- and adding libpg_query as a second oracle is the single highest-value thing anyone can do for this language's numbers.'''

[[deviations]]
what = 'reserved words'
why = '''
29 words may never be an identifier here: SELECT FROM WHERE GROUP HAVING ORDER JOIN UNION INTERSECT EXCEPT INSERT UPDATE DELETE CREATE DROP ALTER TABLE INTO VALUES SET AND OR NOT NULL CASE WHEN THEN ELSE END. All 29 are reserved in SQLite, PostgreSQL and MySQL alike, so no dialect lets a bare column be called `select`.

The set is small on purpose. tree-sitter offers a token only where the parse state could accept it, so SQL's enormous keyword list mostly costs nothing -- a column called `key`, `text` or `value` lexes as an identifier everywhere those words are not tokens the parser could take next. The exception is the position where both readings are live: after `SELECT` an identifier is expected, so before this list existed `SELECT FROM users` parsed as one column named FROM aliased `users`, and the grammar accepted a statement no engine will.

`ON` is deliberately NOT reserved even though all three dialects reserve it: `PRAGMA foreign_keys = ON` puts it in value position and that form is real. The cost is that `SELECT on FROM t` parses. Every word left off the list is a word a column may be named after, which is the safe direction for a union grammar.'''

[[deviations]]
what = 'a T-SQL fringe that no oracle backs'
why = '''
The declared union is SQLite, PostgreSQL and MySQL. T-SQL is NOT in it, and yet this grammar accepts a fringe of it: `[bracketed]` identifiers, `GO` as a batch separator, `ALTER TABLE … WITH NOCHECK`, and `ON [PRIMARY] TEXTIMAGE_ON [PRIMARY]` filegroup placement. That is worth stating plainly rather than leaving to be inferred from the rules.

They are there because mssql migration scripts ship in the same directories as the mysql and postgres ones -- roundcube keeps all three -- so a corpus of "SQL that ships inside installed packages" contains them whether or not the union claims them. Each is unambiguous against the rest of the grammar, which is why they cost nothing to accept.

WHAT THEY LACK IS EVIDENCE. SQLite cannot adjudicate a T-SQL file, so none of this is oracle-backed, and until the oracle bug above was fixed it LOOKED backed: the roundcube mssql scripts have no `;` in them at all, so they arrived as one fragment, failed on a name, and were certified valid. They are corpus noise now, which is the honest classification. The constructs stay -- they are real T-SQL and reading the files they appear in is worth more than the purity of the union statement -- but they rest on documentation, not on measurement, and a second oracle will not change that. Only a T-SQL parser would.'''

[[deviations]]
what = 'one node for every dotted name'
why = '''
`schema.table` in a FROM clause and `table.column` in a WHERE clause are the same three tokens, and this grammar gives them the same node (`qualified_name`) rather than two. Telling them apart is name resolution, not parsing: the parser cannot know whether `a.b` names a column of table `a` or a table `b` in schema `a` without a catalogue. The node carries `_access` where it occurs in expression position, which is where "reads a member" is true of it.'''

[[gaps]]
what = 'the procedural dialects'
detail = '''
PL/pgSQL, PL/SQL, T-SQL batches and MySQL routine bodies do not parse, by design (see `versions`). `test/negative/plpgsql-block.sql` and `test/negative/mysql-delimiter.sql` pin that: a `DO $$ … $$` block and a `DELIMITER //` script must be REJECTED, so the day someone adds them it is a deliberate change with its own evidence rather than a drift.

Narrowed once already: this entry used to claim `CREATE TRIGGER … BEGIN … END` as well, which was wrong. A trigger body is a statement list, not a procedural block, and it is supported now.'''

[[gaps]]
what = 'dollar-quoted strings'
detail = '''
Postgres's `$$ … $$` and `$tag$ … $tag$` need an external scanner -- the closing delimiter is a word that appeared earlier, which no regular token can express, exactly the shape of bash's heredoc. This grammar ships no scanner.c at all, and writing one before a corpus has asked for it is the wrong order. It is the first scanner this language will need.'''

[[gaps]]
what = 'MySQL `SET @var = …`'
detail = '''
`SET @x = 1` does not parse: `@x` lexes as a bind parameter and the assignment rule takes a name on the left. Widening the shared `assignment` node would also accept `UPDATE t SET @x = 1`, which is invalid, so the fix is a MySQL-specific left-hand side rather than a loosened one. Worth doing when a corpus says how much MySQL dump traffic there is.'''

[[gaps]]
what = 'row values on the left of IN'
detail = '''
`WHERE (a, b) IN (SELECT c, d FROM u)` does not parse. `(a, b)` in expression position is a row constructor, and `(a)` would then be both a row of one and a parenthesised expression with nothing to settle them. The row form is supported where it is unambiguous -- `UPDATE t SET (a, b) = (1, 2)`, where only a row is legal -- and the general case needs a dynamic precedence rather than a rule.'''

[[gaps]]
what = 'DCL and the special function forms'
detail = '''
`GRANT`/`REVOKE`, `COMMENT ON`, `SUBSTRING(x FROM 1 FOR 2)`, `TRIM(BOTH ' ' FROM x)`, `POSITION(x IN y)`, MySQL's `group_concat(… SEPARATOR ',')` and `= ALL (subquery)` are all unparsed. `EXTRACT(field FROM source)` IS supported, as the one member of that family common enough to justify reserving its keyword. The rest are listed together because they are one decision, not five: each needs a keyword reserved in a position where an ordinary function call is also legal, and a corpus is what should decide whether that trade is worth making.'''

[[gaps]]
what = 'the rest of the CREATE family'
detail = '''
Measured on the first sweep and still open: `CREATE TYPE`, `CREATE FUNCTION`, `CREATE DOMAIN`, `CREATE OPERATOR`, `CREATE CAST` (118 occurrences, largely postgres's own regression suite) and `CREATE USER`/`CREATE ROLE` (40, DCL). They are one decision rather than several: each is a statement whose tail is a small language of its own, and `CREATE FUNCTION` in particular is the procedural gap above wearing a different hat. Whether they are worth having depends on how much of a real corpus is a database engine's test suite -- in THIS corpus it is 70%, which is a fact about Debian more than about SQL.'''

[[gaps]]
what = 'the reserved-word cost, measured'
detail = '''
Two files fail because perfetto aliases a table `end` (`SELECT end.ts AS end_ts …`), and `END` is one of the 29 reserved words -- CASE needs it. That is the whole measured cost of the reserved list over 4,854 files, which is the number the `deviations` entry is really claiming and now has evidence for.'''

[[gaps]]
what = "postgres's utility statements"
detail = '''
`SHOW` is now supported: the enlarged corpus made it the largest single cluster at 72 occurrences, which is the evidence this entry previously said it was waiting for. `CHECKPOINT`, `VACUUM`, `ANALYZE`, `CLUSTER`, `REINDEX`, `DISCARD` and `RESET` are still unparsed and stay listed rather than added, for the same reason as before -- adding arbitrary members of an open-ended list is how a grammar starts lying about what it covers, and none of them cleared the bar SHOW did.'''

[[gaps]]
what = 'PerfettoSQL'
detail = '''
Chromium and qt6-webengine ship 1,070 files (22% of the corpus) of PerfettoSQL -- a trace-query language with SQL's syntax, its own module system (`INCLUDE PERFETTO MODULE`), and its own table-function syntax (`CREATE PERFETTO TABLE`, `… PARTITIONED hashed_rail_name`). It is to SQL roughly what PL/pgSQL is: the same tokens, a different language. Not in scope, not adjudicable by the SQLite oracle either, and named here so that a future sweep does not rediscover it as 1,070 mystery failures.'''

[[gaps]]
what = 'the optional comma between table members'
detail = '''
SQLite lets `PRIMARY KEY(a, b) FOREIGN KEY(c) REFERENCES t(d)` and `CHECK(…) CHECK(…) FOREIGN KEY(…)` run on without commas; chromium's generated schemas and firefox's places tests do, 12 files between them. REJECTED TWICE, and the second refusal is on better grounds than the first. The first was that a fork at every column of every CREATE TABLE would be ruinous -- and the mysql escape later showed that forking is not what costs time here, so that reason was wrong. The real one is that the ambiguity is GENUINE: with no comma to end a column definition, `a INT CONSTRAINT c PRIMARY KEY` is both a column carrying a named constraint and a column followed by a table constraint, and nothing in the text decides. A tree that varies on every named column constraint in the corpus is worse than twelve generated files that do not parse.'''

[[gaps]]
what = "T-SQL's filegroup clause"
detail = '''
`) ON [PRIMARY] TEXTIMAGE_ON [PRIMARY]` after a mssql `CREATE TABLE` (6 occurrences in roundcube's mssql scripts). The bracketed identifiers parse now; the `ON <filegroup>` tail does not. Small, and unblocked -- it is a table option with a keyword instead of an `=`.'''
