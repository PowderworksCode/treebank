[corpus.gaps]
# Everything the sweep's ledger writer does not carry. It owns
# `[corpus.sweep]` above and replaces that block wholesale on every run —
# prose included, and up to the next section header — so anything written
# between the two sections is eaten. Here, past the header, it survives.
config_files = 267
indeterminate_files = 75725
clusters = 4635
note = """
The locked Debian sweep leaves four distinct buckets. Of 91,834 tree-sitter failures, **15,601 are verified grammar gaps**, **267 are configuration-inherent** files whose preprocessor branches split a construct, and **75,966 are noise** where libclang did not vouch for the source. The oracle detail is 15,868 valid, 238 invalid, 75,725 indeterminate and 3 errors. Indeterminate collapses to false, so no fix agent is aimed at a file whose missing build context prevents a verdict; `gap_files` is deliberately a floor and must be read with this count.

Read the other way: 30,123 + 267 = **30,390 of 121,957 files, 24.92%, are either parsed or accounted for**, and 15,601 are the verified grammar queue. The generated report groups them into 4,635 clusters and keeps concrete examples for agents rather than promoting a few first-error shapes to permanent hand-written counts.

One WebKit file, `Tools/TestWebKitAPI/Tests/WebCore/SerializedScriptValue.cpp`, reproducibly crashed libclang 21.1.8. The oracle driver retried it in a fresh process, recorded it as indeterminate after the second SIGSEGV and continued. A native-oracle crash can therefore reduce evidence for that file, but cannot abort the corpus measurement or become a grammar gap.
"""

[corpus.stand_in_history]
note = """
The superseded first pass used 791 installed libstdc++ 13 headers: 224 passed, 449 were adjudicated as grammar gaps, 2 were configuration-inherent and 116 were noise, including 111 indeterminate, in 143 clusters. That population was intentionally pathological — template metaprogramming, SFINAE, concepts and `_GLIBCXX_*` macros — and was useful while the Debian acquisition path was unfinished, but its 28.32% pass rate and per-construct counts are not measurements of the locked corpus.

It also established which C macro rules C++ could inherit without making the parse table diverge. The rejected leading modifier, declarator-initial and trailing-member forms collide with out-of-line definitions, lambda captures, multiplication and function definitions; notes/DESIGN.md §8.1 retains that design evidence.
"""

[[oracles]]
family = 'cpp'
tool = 'crates/treebank-oracle/tools/c-oracle — the same libclang program C uses, at `-x c++ -std=gnu++17`'
version = 'libclang 21.1.8; the build pins it and ORACLE.md says why the pin matters'
role = '''
primary and only, three-valued (valid / invalid / indeterminate), and the argument for it is C's — see `crates/treebank-oracle/tools/c-oracle/ORACLE.md`. The verdict is read from clang's own diagnostic CATEGORIES and no message text at all.

`gnu++17` rather than the newest standard clang knows, and that is a decision rather than a default. C++20 and C++23 REMOVE things: `throw()` exception specifications were dropped in C++20 and are all over the corpus, and judging by the newest dialect would book working library headers as invalid. C++17 is what a distribution's C++ is written against.'''

[[deviations]]
what = '''
**Six C++ constructs are deliberately absent, and each was cut to make the parse table converge rather than because it is hard to write.** They are, with what each was costing: `f<int>(x)` — an explicit template argument list in EXPRESSION position, the one form that puts `a < b` and `a<b>` in competition at every comparison in the language; `T x(1)` — the parenthesised initialiser, whose parameter-list-or-argument-list ambiguity is the most vexing parse; `if (auto v = f(); v > 0)` — a declaration in a condition, and C++17's init-statement, which put a declaration reading and an expression reading behind every `if (`; `(args + ...)` — the fold expression, a third reading of an open paren; `1_km` — the user-defined literal, a second reading of every literal; and `extern "C" int f(void);` — the brace-less linkage specification, which has no terminator of its own and so made every top-level item ambiguous with the one before it.

`T x{1}`, `T x = 1`, `std::vector<int> v;`, `A<B>::c`, `if constexpr (…)` and `extern "C" { … }` all parse. notes/DESIGN.md §8.1 records the whole sequence, including what did NOT help, so the next attempt starts after it.'''

[[deviations]]
what = '''
**A macro in a namespace head or body parses, and the compiler rejects it.** `namespace std _GLIBCXX_VISIBILITY(default) { … }` opens very nearly every libstdc++ header and `_GLIBCXX_BEGIN_NAMESPACE_VERSION` follows it; unexpanded, neither is anything.

C admits the same shape at FILE SCOPE and C++ cannot afford to — a bare name where a declaration goes hands every `f(x)` a second reading, and that was measured: it was the last four declared conflicts before the table stopped converging. Here it is reachable from exactly two positions, both already committed by the `namespace` keyword before the macro appears. Measured before it was taken: the two positions are 200 and 73 files of 791.'''
