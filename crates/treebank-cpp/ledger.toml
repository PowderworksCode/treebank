# The grammar's evidence file: what it covers, what it is measured
# against, and every place it knowingly differs from the reference
# parser. Prose rather than data, which is why it is TOML.

language = 'cpp'
versions = '''
C++98 through C++23 in one grammar, in the GNU dialect, EXTENDING treebank-c through tree-sitter's own grammar inheritance rather than copying it. C++11 brought `auto`, `decltype`, lambdas, rvalue references, `nullptr`, scoped enums, `= default` and `= delete`, alias declarations, trailing return types, raw strings and variadic templates; C++14 generic lambdas; C++17 nested namespaces, structured bindings and `if constexpr`; C++20 concepts and `requires`, the three-way comparison and coroutines. The GNU extensions come with the base grammar and are not re-listed: `__attribute__`, statement expressions, `typeof`, `asm`, the alternate keyword spellings.

The inheritance is not a convenience. C++ genuinely IS C's declarator grammar with more on top, and the alternative — a second copy of the declaration specifiers, the four declarator shapes, the whole preprocessor and every GNU extension — is a copy that drifts. A fix to the way `int (*f[3])(void)` parses has to land in both languages or in neither.'''
generate_cli = '0.26.12'
vocabulary = '0.1.0'
roles_note = '''
20 of 22 table-tier terms are threaded, one more than C, and the extra one is `_pattern`: C++17's structured binding — `for (const auto& [key, value] : m)` — is the FIRST destructuring position in the C family, and it is exactly what the term is for. `_interpolation` still has no member, because a C++ string cannot embed an expression at any version. `_parameter` is demoted to the facet tier, inherited from C and for C's reason; see `demoted` in roles.json.

Two placements are worth stating. `throw_expression` is NOT a `_jump`, for the structural reason C's `?:` is not a `_branch`: `_jump` nests inside `_control_flow` inside `_statement`, and a `throw` admitted there would make `throw x` parse with no semicolon. C++'s own grammar agrees — a throw-expression is an assignment-expression, which is why `f(cond ? a : throw e)` is legal. And `access_specifier` is not a `_modifier`: `public` says how a base is inherited, not what a declaration means, and admitting it as a modifier made `class W { public int x; };` — a `public:` with the colon left out — parse as a field with a modifier.'''

[corpus]
source = '''
The locked corpus is the 97 admitted Debian sid source packages selected by popcon rank, filtered to packages with at least 2,000 SLOC of C++ and more C++ than C, using only the recorded upstream source archives. Its 121,957 admitted `.cpp`, C++-specific header and content-classified `.h` files are digest-pinned in `corpus-locks/cpp.json`; this replaces the former 791-file installed-libstdc++ stand-in.'''
files = 121957
packages = 97
ranking_note = '''
The C and C++ filters are written as a PARTITION and tested as one: C wants `ansic >= 2000 && ansic >= cpp`, C++ wants `cpp >= 2000 && cpp > ansic`. Without that second half glibc would enter the C++ corpus on its fringe exactly as LibreOffice would enter the C one on its. `.h` belongs to both languages and the extension cannot say which, so `header_is_cxx` decides it by content and is SHARED between the two ecosystems — the corpora divide the headers between them rather than each answering the question its own way.'''
blind_to = '''
`.h` is shared by C and C++ and the extension cannot tell them apart, so the corpus filter reads the file. The content classifier is deliberately only a corpus boundary, not a complete language detector, and may exclude C++ headers without its distinguishing tokens or include C-compatible headers from C++-dominant packages.

No build system is run. Generated headers, package include paths, feature macros and dependency configuration are therefore absent, which is why libclang returns `indeterminate` for much of distribution source rather than fabricating a syntax verdict. Resolving that bucket would require executing arbitrary upstream build systems.

`__cplusplus` is declared DEFINED at `201703L` rather than merely defined, and the value matters: the sweep and the oracle have to agree on a dialect, or a `#if __cplusplus >= 202002L` branch is deleted by one and compiled by the other, and the grammar is measured against a file neither of them read.'''

