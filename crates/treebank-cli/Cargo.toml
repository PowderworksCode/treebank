[package]
name = "treebank-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "treebank"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bzip2 = "0.6.1"
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
libloading = "0.8"
liblzma = { version = "0.4.7", features = ["static"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full"] }
tar = "0.4"
tree-sitter = "0.26"
treebank-preprocessing = { path = "../treebank-preprocessing" }
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
