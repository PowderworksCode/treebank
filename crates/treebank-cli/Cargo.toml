[package]
name = "treebank-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "treebank"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
tree-sitter = "0.26"
treebank-core = { path = "../treebank-core" }
treebank-corpus = { path = "../treebank-corpus" }
treebank-lang = { path = "../treebank-lang" }
treebank-oracle = { path = "../treebank-oracle" }
treebank-preprocessing = { path = "../treebank-preprocessing" }
