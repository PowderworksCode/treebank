[corpus.sweep_history]
note = '''
ONE sweep, and it passed every file, which is a number to be suspicious of rather than pleased with. It is stated first and then argued down.

A 100% pass rate means the sweep MEASURED NOTHING. The oracle is only consulted about files the grammar failed, so with zero failures it was never asked a question; the sweep proved that 19,219 files parse and proved nothing at all about the adjudication behind it. What proves that path works is elsewhere: the committed micro-corpus in `test/sweep-smoke/hcl/`, whose two files are one valid and one deliberately invalid, and which fails if the oracle cannot tell them apart.

It is also not the first attempt, and the intermediate numbers are the interesting ones. The grammar was developed against a hand-assembled survey of 12,053 files -- the Terraform, Vault, Consul, Nomad, Packer, Terragrunt and hcl repositories, chosen because they are the HCL a registry corpus cannot see -- and that survey went 92.1% -> 100% across three findings, each of which is a construct rather than a guess:

  - 394 files: a scanner-owned token behind a NEWLINE was never offered, because an anonymous whitespace extra does not send tree-sitter's lexer round the loop again. Every string in every multi-line list failed. See newline_note.
  - 1 file: a for-expression is an ExprTerm in HCL and may be indexed --
    `[for k, h in var.hosts : h if h.ip != ""][0]` is how a module picks the first match -- and `_loop` was not reachable from the suffix operators.
  - 32 files, found after the corpus sweep already read 100%: a shared rule for the two quote symbols made both valid at once, so the scanner popped its template mode where it should have pushed and every heredoc containing a nested quoted template stopped parsing. `treebank shape` found it, not the sweep.

The last of those is the argument for not trusting this number on its own. The corpus sweep was green before and after.'''

[[oracles]]
family = 'hcl'
tool = 'hclsyntax.ParseConfig, via tools/hcl-oracle (Go)'
version = "github.com/hashicorp/hcl/v2 v2.24.0, pinned in the oracle's go.mod and go.sum"
role = '''
The reference parser IS A LIBRARY here rather than a binary, and that is the finding rather than a shortcut.

`terraform fmt` and `tofu fmt` are the obvious candidates and both of them gate on this same call before they will touch a file: OpenTofu's `processFile` runs `hclsyntax.ParseConfig` and returns its diagnostics unformatted if it has errors. So the verdict a formatter would give IS this verdict, and taking it directly costs one ~100 MB binary less and removes an entire class of "which subcommand did we mean" from the evidence.

**The licence was checked before anything was wired, not after.** HashiCorp moved Terraform to BUSL-1.1 in August 2023 -- 1.5.7 is the last MPL-2.0 release, and IBM's acquisition completing in February 2025 changed the name on the file and not the terms. The `hcl` library stayed MPL-2.0 along with the rest of HashiCorp's libraries. So NOTHING UNDER BUSL IS PINNED ANYWHERE IN THIS REPOSITORY: the validity oracle is the MPL library, and the formatter capability (see below) is OpenTofu, which is the MPL-2.0 fork under the Linux Foundation. The dependency is fetched by `go build` from a committed `go.sum` rather than vendored, the same arrangement as the C oracle's libclang and the TypeScript oracle's `npm ci` -- a tool the gate calls, never code this repository ships.

**This is the syntactic question and only the syntactic question.** `terraform validate` is the tool a reader will expect here and it is deliberately NOT used: it resolves providers, modules and type constraints, needs a `terraform init` before it can say anything at all, and answers whether a configuration is well FORMED -- which is not what a grammar is measured against. `hclsyntax.ParseConfig` reads one file's bytes, follows no `source`, and has never heard of `aws_instance`. The boundary is the library's own, not our discipline's, which is the property that makes it trustworthy.

An unreadable file is never an invalid file: the oracle exits non-zero with no verdict rather than answering `invalid`, because an `invalid` verdict books a file the grammar failed as corpus NOISE. The survey found this immediately -- Packer's test data contains a DIRECTORY named `build.pkr.hcl`, and the oracle stopped rather than calling it invalid.

One thing it checks beyond pure syntax: duplicate attribute names within one body. `a = 1` written twice is "Attribute redefined", which no parse table can express. That is a widening on our side rather than a gap, so the sweep is structurally blind to it; it is declared below and has its own negative fixture.'''

[[deviations]]
what = '''
An expression that is INCOMPLETE at the end of a line continues onto the next one here, and terminates in HCL.

`x = a +` followed by `b` on the next line parses as one attribute here and is a parse error for hclsyntax; so do `x = a ?` / `b : c`, and every other form that ends a line mid-expression. The mechanism is the one the newline_note describes from the other side: where the parse table admits `_newline` the scanner offers one and the attribute ends correctly, and where it does not -- mid-expression, after an operator -- the newline falls through to `extras` and is trivia.

**This never mis-parses valid HCL, and the boundary is worth stating precisely.** A COMPLETE expression at end of line is followed by a position where `_newline` is valid, so the scanner emits it and the item ends: `x = [1, 2]` followed by `[3]` on the next line is two items here as well, and errors as it should. Only an expression that cannot end where the line does is affected, and no valid file contains one. So the whole deviation lives on input HCL rejects, which is exactly the direction a corpus sweep cannot see -- `test/negative/` is where it is pinned down.

The most visible instance is a BLOCK HEADER, and it is the one that motivated writing this up rather than filing it as a curiosity: a bare identifier on its own line followed by a block on the next joins them into one block with an extra label. Packer's own `fmt_errs/malformed.pkr.hcl` fixture is that shape.

Fixing it needs the newline-inclusion mode hclsyntax has and an LR table does not, which would mean two copies of the expression grammar.

Measured independently by `treebank mutate`: 101 of its 195 widenings are this deviation, and it is the largest class by a factor of three.'''

[[deviations]]
what = '''
Inside an OBJECT, a newline is a separator here and a significant token everywhere in HCL.

`{a = 1\nb = 2}` and `{a = 1,\nb = 2}` parse correctly and `{a = 1\n, b = 2}` is correctly rejected, because the separator rule spells that asymmetry out. What the grammar cannot say is that a newline is ALSO forbidden at the object's other positions: `{a =\n1}`, `{a\n= 1}` and `{a = 1 +\n2}` all parse here and all three are errors for hclsyntax.

Same root as the deviation above and the same reason it stands: inside an object hclsyntax keeps newlines in the token stream at every position, and reproducing that would need an object's expression grammar to be a second copy of the ordinary one.'''

[[deviations]]
what = '''
A block LABEL admits `${…}` and `%{…}` here; hclsyntax rejects both.

A label is a `StringLit`, which is a quoted string with escapes and no template, and `blk "${a}" {}` is an error -- Terraform's own `invalid-files/interp-in-rsrc-label.tf` fixture is exactly that. The label is one token here, so it can validate the escape sequences (`blk "a\qb" {}` is rejected, as it should be) but cannot also exclude an interpolation introduction without a lookahead-shaped regex the token DSL does not have. It is a widening on input HCL rejects; it has a negative fixture.'''

[[deviations]]
what = '''
The legacy index applies where hclsyntax has a NUMBER, and chains where hclsyntax stops at one.

The legacy `.0` index exists only for compatibility with HCL's precursor language and the spec requires a conforming parser to accept it. It also says why it does not chain: in `foo.0.0`, `0.0` lexes as a number literal and the sequence is invalid. That is a LEXICAL consequence in hclsyntax and a rule here, and the rule is not reproduced -- `token.immediate(/\.[0-9]+/)` matches `.0` and then `.1`.

The same widening has a second spelling that only `treebank mutate` found, in 21 of its 195 widenings: `1.5.7` is one invalid number literal to hclsyntax and a float followed by a legacy index here. Narrowing the operand to exclude a number needs a second copy of the expression-term rule and risks a real gap -- `f(x).0` is legal, so the operand cannot simply be a traversal -- which is not a trade worth making for a construct nobody has written since HCL 1.'''

[[deviations]]
what = '''
A duplicate attribute name in one body parses here and is "Attribute redefined" for hclsyntax.

It is a check the reference parser makes and a parse table cannot: `a = 1` twice is two well-formed declarations, and noticing that they collide is a pass over the body rather than a property of the derivation. It accounts for most of the accepts-invalid files found in the pre-corpus survey, all of them in the deliberately-invalid test data of Terraform and Vault, and for 31 of `treebank mutate`'s 195 widenings. Recorded here because the sweep is blind to it in principle, not because it is close to being fixed.'''

[[deviations]]
what = '''
An identifier's character classes are UAX#31's general categories and not the property itself.

HCL defines an identifier as `ID_Start (ID_Continue | '-')*` under UAX#31, and hclsyntax uses Go's tables for it. This grammar uses the Unicode general categories those properties are built from -- `L`, `Nl`, `Mn`, `Mc`, `Nd`, `Pc` -- which is the same set apart from `Other_ID_Start` and `Other_ID_Continue`, two small lists of legacy code points the property adds on top (a handful of CJK and Georgian characters, some combining marks). So the difference is a NARROWING, on identifiers no configuration language is written in; nothing in the corpus is affected and nothing would be measured by a wider class. Recorded because the spec names a property and this names an approximation of it, and a reader should not have to diff the two to find that out.'''

[[known_gaps]]
construct = 'a comment inside a closing template directive'
files = 0
note = '''
`%{ /* c */ endif }` is valid HCL and is rejected here. So are the same shapes for `%{ else }` and `%{ endfor }`.

The three closing directives are single tokens, and that is what buys this grammar its zero declared conflicts. `template_body` is a named rule, so ending one is a REDUCE, and with `%{` spelling both "a nested directive begins" and "this body is over" the reduce and the shift compete on the same lookahead -- an LR(1) table cannot see the `if` or the `endif` behind it. The alternatives were a declared conflict with a dynamic weight (a cheap fork, dying one token later, but a fork at every `%{` in the language) or flattening `template_body` and `else_clause` away, which buys the table what it wants by throwing out the structure a consumer asked for. Making the closers one token each moves the decision to the lexer, where longest-match settles it for free.

The cost is exactly this: the token admits horizontal space and newlines between `%{`, the keyword and `}`, because HCL does, and it cannot admit a comment because a token is a DFA over characters and a comment is a node. Zero files in the pre-corpus survey of 12,053 contained one.'''
