[package]
name = "treebank-preprocessing"
version = "0.1.0"
# Only the `treebank` crate is published. Everything else is a workspace
# member: the grammars ship as wasm packs and the CLI is not a library.
publish = false
edition = "2021"
license = "MIT"
description = "Dead-branch elimination for languages with a C-style preprocessor, so a parse failure can be judged against the configuration a compiler actually saw."
