[[known_limits]]
signature = '''
Expr::Binary / Expr::Unary / Expr::Reference / Expr::Cast <- binary_expression'''
files = 100
why = '''
The operands of a RANGE are not greedy enough. `v[start * size..(start + len) * size]` parses as a call on an open range — `((start*size..)(start+len)) * size` — because after `start*size..` the range is already complete and `(` reads as a call; `v[start..*end]` becomes `(start..) * end` for the same reason. Making the two-ended form greedy fixes both and breaks `for i in 0u32.. { ... }`, where the loop body then becomes the range's end operand. The correct fix is an operand tier that excludes block-like expressions, which the grammar does not have yet — `_no_struct_expression` restricts the wrong thing. Measured both ways; the committed behaviour is the one that keeps the sweep at 2 gaps.'''

[[known_limits]]
signature = 'Item::* <- source_file and ImplItem/Variant <- *_list'
files = 1300
why = '''
A `///` doc comment becomes a `#[doc]` attribute in syn and is inside the item; ours stays a comment extra outside it. The checker already counts leading extras as a node's own, which fixes the common case, but not when an ATTRIBUTE sits between the doc comment and the item (`/// doc` then `#[derive(Debug)]` then `struct`): the attribute is a real node, so the walk back over extras stops there. Modelling doc comments as attributes is the real answer and is a grammar change, not a checker one.'''

[[mismatch_ignore]]
signature = 'Expr::Range => binary_expression'
why = '''
The range-operand limit already recorded under known_limits, arriving through the mapping instead of the boundary: `v[start..*end]` reads as `(start..) * end`, so syn's range span holds our binary expression.'''

