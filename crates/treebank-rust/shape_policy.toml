# Declared exceptions for `treebank shape`. Every entry names WHY, and a
# reason nobody can read is a reason nobody re-examines -- which is how a
# check like this quietly stops working. TOML so the reasons are legible.

rule = '''
Boundaries `treebank shape` may ignore, as `"<synKind> <- <our_kind>"` pairs. Each is a place our tree groups the code DIFFERENTLY from syn on purpose, not a place we disagree about the code. Pairs rather than bare syn kinds: ignoring `Expr::Path` outright would also silence a real Expr::Path disagreement elsewhere, which is how a check like this quietly stops working.'''
oracle_note = '''
syn, in-process, with proc-macro2's `span-locations` feature turning every span into a file-relative byte_range(). HIR was the obvious candidate and the wrong one: it is post-desugaring, so `for` and `while` become `loop` plus `match` and `?` becomes a match on Try, and comparing a surface tree against it would report a disagreement at each, none of them a parser defect. rustc's AST is the right level but unreachable — `-Zast-json` was removed in 2020 and `-Zunpretty=ast-tree` prints session-global BytePos on nightly.'''
attribute_note = '''
The `Expr::* <- block|arguments|array_expression|tuple_expression` family is one difference seen from many angles: syn treats an attribute on an EXPRESSION as part of that expression, while our grammar attaches attributes to statements and items but leaves them as siblings elsewhere. Not a mis-parse — the attribute is adjacent to the thing it decorates either way — but a place our tree says less than syn's, and a candidate for a real change later.'''
baseline_missed = 275
baseline_note = '''
275 missed of 58,476,153 oracle nodes across 61,753 files, raised from 148 of 31,558,086 when the corpus went from 1,000 crates to 2,500. Raised because the RATE did not move: 4.690 missed per million nodes before, 4.703 after. A number that grows exactly in proportion to the corpus is the corpus growing, and the ratchet has to be told so explicitly rather than left to drift.

Two things were fixed rather than absorbed on the way to that number. The oracle was reporting spans relative to the text AFTER a shebang, which cost 62 misses the moment the grammar learned to parse shebang files; see rust_spans.rs. And 92 of the 98 kind mismatches were the deliberate choice to parse attribute-macro input structurally, now declared in mismatch_ignore. Two kind mismatches remain, one node each, both a type path we label as a value path.'''

[[ignore]]
signature = 'Pat::Type <- let_declaration'
why = '''
`let x: T = ...` — syn wraps the pattern and its type in a `Pat::Type` node; our `let_declaration` carries them as `pattern` and `type` fields. The largest single difference in the corpus, and purely a grouping choice: ours names the parts, syn boxes them.'''

[[ignore]]
signature = 'Field <- ordered_field_declaration_list'
why = '''
`struct Magi<T>(pub T);` — syn's Field covers the visibility and the type of a tuple-struct field; we keep them as children of the field list with no wrapping node, the same way we treat other positional lists.'''

[[ignore]]
signature = 'Expr::Binary <- let_chain'
why = '''
`if let Some(x) = a && cond` — syn has no let-chain node and models the whole thing as a Binary whose operands include a `let`. We have `let_chain`, which says what the construct is.'''

[[ignore]]
signature = 'Pat::Reference <- reference_pattern'
why = '''
`&line` as a pattern — syn's Pat::Reference includes the `mut` of `&mut x`; our `reference_pattern` splits the mutability out as its own node.'''

[[ignore]]
signature = 'Stmt::Expr <- block'
why = '''
An expression carrying an attribute (`#[allow(...)] expr`) in a position where we do not wrap: syn folds the attribute into the expression's own span, our attribute is a sibling. See the shared note below.'''

