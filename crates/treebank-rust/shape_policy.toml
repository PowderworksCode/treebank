[[mismatch_ignore]]
signature = 'Item::Macro => source_file'
why = '''
One file: a macro invocation at the very top of a file where our tree has no node between it and source_file. Not isolated further.'''

[[mismatch_ignore]]
signature = 'Item::Other => impl_block'
why = '''
`#[ext] pub impl<T> Cell<T> { … }`. An attribute macro receives its item as a token stream, so `pub impl` is real code that never reaches rustc's item parser; syn parks it as `Item::Verbatim` and reports no interior at all, while this grammar parses it. Being MORE structural than the oracle on macro input is the deliberate choice recorded in ledger.toml, and this is what it looks like from the shape check.'''

[[mismatch_ignore]]
signature = 'Item::Other => static_definition'
why = '''
`#[distributed_slice] pub static SLICE: [i32];` — a static with no initializer, which is linkme macro input rather than a standalone item. Same phenomenon as the `pub impl` entry above and the same call.'''
