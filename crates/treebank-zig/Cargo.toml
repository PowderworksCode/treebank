[package]
name = "treebank-zig"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Zig 0.11 through 0.15 in one grammar, carrying the treebank node vocabulary"
repository = "https://github.com/PowderworksCode/treebank"
keywords = ["incremental", "parsing", "tree-sitter", "zig"]
categories = ["parsing", "text-editors"]
build = "build.rs"
include = [
  "LICENSE",
  "bindings/rust/*",
  "grammar.js",
  "build.rs",
  "src/*.c",
  "src/*.json",
  "src/tree_sitter/*.h",
  "roles.json",
  "ledger.toml",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.26"
serde_json = "1"
toml = "0.9"
