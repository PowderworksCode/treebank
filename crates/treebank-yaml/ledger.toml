# The grammar's evidence file: what it covers, what it is measured
# against, and every place it knowingly differs from the reference
# parser. Prose rather than data, which is why it is TOML.

language = 'yaml'
versions = '''
YAML 1.1 and 1.2 in one grammar, `.yaml` and `.yml` alike.

The union is NOMINAL here, and saying so is the first honest thing this file has to do, because the brief for this grammar assumed the opposite. YAML 1.1 and 1.2 genuinely differ and the installed base is genuinely split — libyaml and PyYAML descend from 1.1, ruamel and go-yaml v3 aim at 1.2 — but almost every difference between them is a RESOLUTION difference, and a grammar has no opinion about resolution. Whether `no` is a boolean, `0o14` an integer and `12:30` a sexagesimal number is decided by a SCHEMA applied to a scalar this grammar has already parsed. So the Norway problem is not a parse problem.

Measured rather than argued. The `yaml` package is the only implementation available that can be asked BOTH version questions with everything else held constant, and over the 406 cases of yaml-test-suite its verdict changes on exactly ONE case between `version: "1.2"` and `version: "1.1"` — QLJ7, and that one is about whether a `%TAG` handle declared in the first document is still in scope in the second, which is a directive-scope rule rather than a production. Over 29 hand-picked probes at the constructs where the two versions are supposed to part company — the JSON-adjacent `{"a":1}`, a `%YAML 1.1` directive, tabs, flow-mapping keys, plain scalars containing a colon — the two versions agree on all 29.

DESIGN.md §4.2's "latest version wins" is therefore never invoked, and there is no `version_policy.toml`: no construct is rejected on version grounds because no construct needed to be. What the oracle still carries a 1.1 leg for is that the claim is now measured instead of assumed, and the measurement is one case in 406.

The split that IS real is between IMPLEMENTATIONS, not versions, and it is large: over the same 406 cases the spec-first parser and the libyaml lineage disagree on 71. That is the union this grammar's oracle is actually built over, and `[[oracles]]` says so.'''
generate_cli = '0.26.12'
vocabulary = '0.1.0'

parser_note = '''
`src/parser.c` is 392 KB and the table is 527 states, against 1,245 for the next smallest (java) and 26,576 for the largest (C++), with zero declared conflicts. That is not because YAML is simple. It is because YAML's structure is COLUMNS, and a context-free rule cannot ask about a column, so the decisions were pushed to the highest rung of FIELD_GUIDE.md §1's ladder — the lexer — and what is left for the parse table is short.

`src/scanner.c` is 929 lines and owns twenty-one tokens — 22 externals, one of which is the error sentinel that is never produced: the `_block_end` that pops the indent stack, `_indented` and `_empty_node`, the entry indicator, both spellings of `:`, the explicit-key `?`, the four flow brackets, both document markers, the anchor and alias sigils, the anchor name, tags, and all four kinds of scalar. Only ruby declares more externals (35) and its table is fourteen times the size. Owning that much is a cost worth naming, because it moves correctness out of a generated table and into hand-written C where only tests can see it. Three things make it the right trade anyway.

The first is that YAML's own specification is written this way. Its "simple key" machinery — a key is one line and at most 1024 characters — is lexer state in every implementation there is, and the productions are parameterised by an indentation level `n` that no LR table carries.

The second is that ownership is what makes the scanner's state TRUE. The runtime restores the serialized scanner state before each scan, so anything a declining scan writes is lost; a `line_column` set while declining a token the internal lexer then took is a `line_column` the next call will not see. That bug is why `&a1` / newline / `!!str` / newline / `scalar1` parsed as three documents for an afternoon, and the fix was not a guard but making the scanner own `&`, `*`, tags and `---` so that every token which can begin a line passes through it.

The third is that it buys a table with nothing to be ambiguous about. The two decisions that would otherwise fork at every scalar in the language are made by giving one spelling two tokens: `-` is an entry indicator only where a block collection may begin, and `:` is `_block_map_colon` when it follows its key on one line and `_own_line_colon` when it begins a line of its own. Each pair is emitted by the same owner from its own state, so the parser is never offered a choice it could starve on — FIELD_GUIDE.md §4's hazard used deliberately, which is the arrangement §4 recommends.'''

roles_note = '''
YAML is the first language in this repository that does not COMPUTE, and the vocabulary shows it: 5 of the 22 table-tier terms are threaded and 17 are absent. The absences are the interesting half, because they are not gaps.

Threaded: `_expression`, `_literal`, `_name`, `_type`, `_directive`.

`_expression` is every node. "Denotes a value" is the definition, and in a data language every node denotes a value and nothing else does, so the term that is a fine-grained classifier elsewhere is here the universal one. It carries `_literal` inside it, which is the four scalar kinds — plain, single-quoted, double-quoted and block — every one of them fully determined by its own text.

`_type` is the TAG, and this is the one thread worth arguing for. `!!str`, `!!int`, `!MyClass` are exactly "syntax in type position": a tag names the type of the node it is attached to, which is what YAML's own specification calls it. The alternative reading was `_attribute`, "annotation attached to a declaration", and it was rejected because YAML has no declarations for an annotation to attach to and because a tag is not decoration — it changes what the node IS.

`_name` is the anchor name, in both the `&a` that introduces it and the `*a` that refers to it. One node type for both, because an alias's name IS an anchor name.

`_directive` is `%YAML` and `%TAG`, which affect the stream rather than computing in it — the term's definition, almost verbatim.

Now the seventeen. `_statement`, `_control_flow`, `_branch`, `_loop`, `_jump`, `_assignment`, `_invocation`, `_access`, `_callable` are all about EXECUTION, and a YAML document does not execute. There is nothing here that alters sequential control, nothing to apply, nothing to store into and nothing to call. `_declaration`, `_member`, `_parameter`, `_argument`, `_modifier`, `_body`, `_pattern` are about the shape of a program's definitions, and YAML has no definitions: an anchor introduces a name but does not declare an entity, which is exactly the `_declaration`/`_binding` distinction DESIGN.md §3.2 draws, and the anchor is on the `_binding` side. `_attribute` is covered above. `_interpolation` is absent because YAML strings do not interpolate — `{{ x }}` in an Ansible playbook is a nested flow mapping to YAML and a template to Ansible, and the grammar is right to see only the former.

Six facets carry what the table tier cannot. `_comment` holds `comment` and `_identifier` holds the two name-shaped tokens, both of them the ordinary answers. Of the other four, `_clause` holds the three subordinate pieces — `block_mapping_pair`, `block_sequence_item`, `flow_pair` — each of which is a piece of a larger construct and is neither a statement nor an expression. `_binding` holds `anchor`. `_scope` holds `document` and `stream`, and `document` is a genuine lexical scope rather than a convenient one: an anchor is visible only within the document that defines it. `_string` holds the three scalar kinds that are always strings and deliberately NOT `plain_scalar`, because a plain scalar is where `null`, `true` and `42` live and calling it a string would be the very schema opinion this grammar refuses to hold.'''

conformance = '''
yaml-test-suite at da267a5, the case set the language's own community maintains: 406 cases, 312 of which must parse and 94 of which must be rejected. It is used here in place of the fuzzer, and it is a better instrument than one, because every case is a construct somebody argued about.

**Parses: 310 of 312.** The two that do not are one construct and are recorded in `known_gaps`: they are the half of an implementation disagreement this grammar had to choose against.

**Shape: 298 of 303.** The suite ships the expected EVENT STREAM for each case, which is a tree in a different notation, so it can be compared against ours directly — the check `treebank shape` performs against a span oracle for other languages, done here against the language's own answer key. Our tree is folded to `+STR/+DOC/+MAP/+SEQ/=VAL/=ALI` and compared for structure; scalar text, styles, tags and anchors are dropped, because those are resolution or presentation. 303 of the 312 valid cases carry an event stream and 298 of them match. Three of the five that do not are one construct and are declared as a deviation below; the other two are the two the grammar does not parse at all.

Two mis-parses were found this way and fixed, and neither was reachable from an accept/reject test: `seq:` / ` &anchor` / `- a` closed the mapping and started a new document rather than anchoring the sequence, and a `...` with no document in front of it produced an empty document that the file does not contain.

**Rejects: 69 of 94.** This is the accepts-invalid direction, and it was 46 when the grammar landed. What closed the gap is written up in `narrowing` below, including the one rule that had to be taken back out again.'''

narrowing = '''
The accepts-invalid direction is the one no corpus can measure, because real files are valid. It was 46 of yaml-test-suite's 94 error cases at first light and is 69 now, and the seven rules that did it are worth naming because six of them are the same KIND of rule: a column, checked at a position where the parser cannot see one.

* **An entry is at its collection's column.** The next pair of an open mapping and the next entry of an open sequence sit at exactly the column that collection opened at; deeper is not a nested anything, because a collection nests under a VALUE. The scanner tells the two positions apart by whether `_indented` is on offer, and declines at the wrong one. Five cases.
* **A block collection may not open on the `---` line.** The marker is not indentation the way a `-` is, so `--- key1: v` / `    key2: v` has nowhere to put the mapping's indentation. Implemented by NOT resetting `line_column` at the marker, which is one call changed.
* **A bare document may follow only the head of the stream or a `...`.** Everywhere else a document has to announce itself, which is what stops the text after a finished one from quietly becoming a second. This is unbounded history — has a `...` been seen since the last document began — so it is a bit in the scanner rather than the two-state stream with four spellings of `document` that a context-free rule would need. Six cases, and it is the rule this ledger previously declared unfixable.
* **Nothing follows a `...` on its line.** A `---` may carry its document's node; a `...` may not carry anything.
* **A quoted scalar does not cross a document marker.** `---` at column 0 ends the document whatever is open, so a quote left hanging above one is unterminated rather than very long.
* **A tab may not separate an indicator from a collection.** `- ` and `? ` count as indentation for what they introduce, and indentation is spaces, so `-` tab `-` is not a nested sequence — while a tab in front of a SCALAR is ordinary separation and stays legal. Four cases.
* **A leading blank line may not out-indent its block scalar.** With no indentation indicator the first content line sets the block's indentation, and an earlier all-space line that reached further than that is an error rather than a longer blank. Three cases.

And one rule that was tried and REMOVED, which is the more useful half of this section. YAML says a quoted scalar folding onto another line must be indented past the collection that holds it, so `msg: "one line` / `    a second at the mapping's own column"` is not YAML. Every implementation reads it anyway, Ansible writes it by the thousand, and the sweep found 18 files that the rule turned from passing into gaps. It bought one suite case and cost eighteen real files, so it is gone and the shape has a corpus fixture instead. The union oracle exists to make exactly that call, and this is the first time it has been asked to.'''

incremental_check = '''
`treebank incremental` — 3,000 corpus files, 3 edits each, 9,000 edits: **0 diverged**. A reparse after an edit is byte-identical to a fresh parse of the edited text.

This is the check this grammar most needed, and it is the reason the scanner serializes every field it has. Twenty external tokens mean twenty ways for a reparse to start from a state the fresh parse never had; an indent stack that did not round-trip would show up nowhere else, because every other check here parses from scratch.

The measurement also has a corollary the design already relied on: the runtime restores the serialized state before EVERY scan, including one that goes on to decline. That is not a fact about incremental parsing at all — it is why the scanner has to own every token that can begin a line.'''

recovery_check = '''
`treebank recovery` — 1,500 files, up to 8 single-token deletions each: 29 deletions break the parse, with a median blast radius of 0% and a p90 of 97.4%. Two files are shredded, both by deleting a `,` from a long flow sequence.

The shape of that distribution is the language rather than the grammar. Delete a token from a block collection and the damage is local, because the next line's column re-establishes where everything is; delete one from a flow collection and nothing re-establishes anything until the closing bracket, so the error runs to the end of it. A 1,600-entry flow sequence in a Kubernetes manifest is therefore an all-or-nothing structure for an editor, and no arrangement of this grammar changes that.'''

[corpus]
source = 'the 500 most-starred repositories GitHub classifies as YAML, fetched 2026-08-30 at their default-branch commit; 499 of them yielded admitted files'
files = 128334
packages = 499
ranking_note = '''
YAML is a guest language, more completely than shell is. Nobody publishes a YAML package, there is no registry, no download count, and nothing that could be ranked — so every corpus for it is somebody else's corpus with the YAML taken out, and the only decision worth making is whose.

GitHub's own classification is the measurement that settles it, and it is worth stating because it is counter-intuitive. Linguist marks YAML as `data` and leaves data languages out of a repository's language statistics, so `language:YAML` matches only repositories that contain almost nothing else — 2,107 of them in total when this was fetched, against the tens of millions of repositories that carry YAML. "The top YAML repositories" is therefore not a sample of where YAML lives. It is a sample of the one place YAML is the whole product, and 500 repositories is a quarter of that entire population rather than a thin slice off the top.

That place is real: GitOps cluster repositories, Ansible collections and roles, Home Assistant configurations, CIS hardening baselines, machine-generated manifest sets. It is where the second, third and fourth entries in this ranking come from, and between them the 499 packages carry 128,334 admitted files.

`TREEBANK_YAML_CORPUS=pypi` selects the other source and asks the other question: what does YAML look like when it ships INSIDE software written in something else. A source distribution carries the workflows, the pre-commit configuration, the conda recipe, the OpenAPI document and the test fixtures, and those are where anchors, explicit keys, multi-document streams and tags actually occur. It is a far smaller corpus per package — many top packages carry no YAML at all — and a far wider one per file. It is implemented and NOT swept here; a pass rate over one population is not a pass rate over the other, and this ledger's number is from `github`.'''
blind_to = '''
Helm charts, and with them the single largest body of `.yaml` files in the world. A file whose lines open with `{{- if …}}` or `{% for … %}` is a template that RENDERS to YAML and is not YAML, so `admit` excludes it — see the reasoning in `treebank-corpus/src/yaml.rs`. Inline interpolation is deliberately kept: `image: {{ ansible_hostname }}` is legal YAML that every implementation reads, and excluding it would have thrown away most of an Ansible corpus. The exclusion is the right call and it is also a hole: whatever a Helm template does to a parser, this number does not know.

Everything else this corpus is blind to follows from what a GitOps repository is. It is MACHINE-WRITTEN as often as not, so it is syntactically narrow — plain mappings, sequences, quoted scalars, the occasional block scalar — and the constructs this grammar spent the most effort on are barely present in it. Anchors and aliases appear, but explicit `?` keys, complex collection keys, `%TAG` directives, verbatim `!<…>` tags and multi-document streams with directives are close to absent. The conformance suite is what measures those, which is why `conformance` above is a separate section rather than a footnote to this one.

And the metric is stars, which is attention rather than use — the weakest popularity metric in this repository, and the one `lang::github` already describes. A star costs nothing and never decays.

The direction no corpus can see is the other one. Real files are valid, so no quantity of them shows whether the grammar rejects what YAML rejects; `test/negative/` and the suite's 94 error cases are the only mirror, and they say 69 of 94.'''

