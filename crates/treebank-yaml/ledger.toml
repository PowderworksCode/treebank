[corpus.sweep_history]
note = '''
**The pass rate went DOWN in the last round and that is the improvement.** 99.81% to 99.71%, with gap files staying at 0. `pass_rate` counts every file the grammar accepts, and 126 of the files it used to accept are not YAML — a GPL licence text saved as `.yaml`, Ansible playbooks with a key indented one column too far, files with a second document nobody announced. Narrowing moves those from `passed` to `noise`, which is the whole point of narrowing, and it is why `gap_files` rather than `pass_rate` is the number to read. A grammar can reach 100% here by accepting everything.

Four sweeps over the same 128,334 files: 99.80% -> 99.81% -> 99.81% -> 99.71%, 8 gap files -> 1 -> 0 -> 0. It is a short history because the corpus had little to say, and that is itself the finding: a population of GitOps manifests and Ansible roles exercises a narrow band of the language very hard and the rest of it not at all. Every construct this grammar found difficult — explicit keys, compact collections under properties, the two spellings of `:` — was settled against yaml-test-suite before the first sweep ran, and the sweep then found three defects the suite could not have.

The fourth round is the narrowing described in `narrowing` above, and the corpus earned its keep there twice over: it found nothing wrong with six of the seven new rules, and it killed the seventh outright — 18 files that a spec-accurate rule about quoted-scalar indentation turned into gaps, against one suite case it bought.

The first three rounds were about text that is invisible when you read a file and decisive when you lex one. A comment measured the next line's indentation to decide whether the collection above it had ended, and stopped at a line of trailing spaces; that closed every collection above a comment followed by a blank line, which in a hand-edited workflow is most of them (5 files). The `-` probe consumed its dash before deciding the dash was not an indicator, so `-: ""` lost its key (1 file). And the last one was not a defect at all but an implementation disagreement, recorded in known_gaps (1 file).

The 249 remaining failures are all corpus noise, and the union oracle is what says so rather than an assumption: every one of them is rejected by the spec-first parser at 1.2, by the same parser at 1.1, AND by libyaml. What they are is templates the admission filter did not catch — Helm charts whose braces happen to lex, Jinja that renders to YAML — and files that are simply broken.'''

[[oracles]]
family = 'yaml'
tool = 'the `yaml` npm package 2.9.0 (tools/yaml-oracle/check.mjs and check11.mjs), and PyYAML 6.0.1 over libyaml (check.py)'
version = 'yaml 2.9.0 at version 1.2 and at version 1.1; PyYAML 6.0.1 with the C loader'
role = '''
YAML is the only language here with no owning implementation. The specification is the owner, every implementation disagrees with it somewhere, and they disagree with each other — so the oracle choice is a real decision and this is the justification it owes.

Measured on yaml-test-suite's 406 cases, correct verdicts: `yaml` 2.9.0 402, js-yaml 5.4.1 373, ruamel 0.17.21 353, PyYAML 6.0.1 335. That gap is not close, and it is why `yaml` is the primary leg.

The oracle is a UNION of three legs, and a file is valid if ANY of them accepts it. That direction is deliberate and it is the conservative one: a more permissive oracle books MORE of this grammar's failures as gaps and fewer as noise, never the other way round. An oracle that is eager to say "invalid" flatters the grammar it is judging, which is the trap the zig ledger names in preferring `zig fmt` to `ast-check`, and it is the reason the legs are added rather than intersected.

1. `yaml` 2.9.0 at version 1.2, through `parseAllDocuments`, reading `doc.errors`. This is `validate_current` on its own. Warnings are deliberately not read: a duplicate key and an unknown tag are warnings there, both are resolution, and a grammar has no opinion about either.

2. The same parser at version 1.1. This is the version union, and it is here to be MEASURED. See `versions`: over the whole suite it changes one verdict.

3. PyYAML 6.0.1 through `yaml.parse`, which is the libyaml lineage — the state machine PyYAML, the C bindings, Ruby's Psych and Go's yaml packages all descend from. This is NOT a version. It is the other half of the installed base, and it is the leg that matters in practice: a file the whole Python and Ruby world reads without complaint is a file this grammar had better parse, whatever the specification says about it. `yaml.parse` runs the parser and stops there — no composing, no tag resolution, no construction — for the same reason the zig oracle prefers `zig fmt` to `ast-check`.

What the union makes this blind to, stated plainly: PyYAML accepts 16 of the suite's 94 known-invalid cases, so those 16 shapes are "valid" to this oracle. If the grammar rejects one of them the sweep will call it a gap when it is not. That is the price of the third leg and it is paid in the direction that costs us numbers rather than the one that buys us them.'''

[[known_gaps]]
construct = 'an anchor or alias name containing a `:`'
files = 0
note = '''
Zero corpus files and two yaml-test-suite cases: 2SXE (`&a: key: &a value`) and W5VH (`&:@*!$"<foo>: scalar a`). Both are rejected, deliberately, and the reason is that YAML's two implementation families disagree about the production and a single lexer cannot satisfy both.

`ns-anchor-char` is every non-space character except the four flow indicators, so a `:` is legal INSIDE an anchor name. Read that way, `*app: {}` is an alias to a name called `app:` followed by a stray `{}`, and the spec-first parser rejects it on exactly that ground — measured, not assumed: `yaml` 2.9.0 answers `Unresolved alias (the anchor must be set before the alias): app:`. PyYAML narrows anchor names to word characters, reads the alias as `app`, and accepts the file. Each family is right about one of the two shapes and wrong about the other.

The corpus decided it. `*alias:` as a mapping key appears in 8 of the 499 packages — it is how Kubernetes YAML reuses an anchored name — and under the spec reading the sweep reported that file as its last remaining gap. No anchor name in 128,334 files contains a colon outside a quoted string. So the name ends at a `:` followed by whitespace, which is the same rule that ends a plain scalar, and these two cases are the price.

This is the one place in this grammar where DESIGN.md §4.2's "latest version wins" has an analogue and does not apply: the two readings are not two versions, they are two implementations that are both current, and the tiebreak had to be the corpus rather than a date.'''

[[known_widenings]]
construct = 'two anchors on one node, `&a` then `&b value`'
found_by = 'yaml-test-suite (4JVG)'
why_accepted = '''
`_properties` admits at most one anchor and one tag, so a second anchor on a following line is read as the content of the first — an anchored node whose content is another anchored node, which the data model has no room for.'''
why_not_fixed = '''
Telling the two apart needs `_properties` to span line breaks, which is the one place `_indented` currently means "the content starts here" and would have to mean "more properties may still arrive". It is one case and the shape does not occur in 128,334 corpus files.'''

[[known_widenings]]
construct = 'a comment with no whitespace in front of it, `"foo"#bar`'
found_by = 'yaml-test-suite (SU5Z, 9JBA, CVW2)'
why_accepted = '''
`comment` is an `extras` pattern, so it matches a `#` wherever one appears and there is nothing left for the parser to reject.'''
why_not_fixed = '''
Tried and backed out. Enforcing it means the scanner owning the token, and the scanner already does something else at a `#`: it scans forward to the next line with CODE on it to decide whether the collection above the comment has ended. Both want `mark_end` in a different place — the close is zero width at the comment's start, the comment ends at the line's end — and `mark_end` only moves forward. Emitting the comment first would put every trailing comment inside the block above it, which is a span regression for three suite cases.'''

[[deviations]]
what = '''
A flow-mapping entry with no `:` is a bare node in this tree, not a pair with an empty value. `{ a, b }` and `{ http://foo.com }` produce two nodes and one node; the YAML data model produces two pairs and one pair, each with an empty value, and yaml-test-suite's event streams say so. This is the whole of the 3-case shape difference above (4ABK, 8KB6, 9BXH).

It is deliberate. A tree-sitter tree describes what is WRITTEN, and no `:` is written there; inventing a pair with two empty halves would put two nodes in the tree with no text behind either. The consumer that wants the data model applies it above the parse, which is where DESIGN.md §1 puts every other semantic question.'''

[[deviations]]
what = '''
`&a foo: 1` anchors the KEY, not the mapping. YAML tells the two readings apart by a line break — properties followed by a newline and an indented block anchor the collection, properties on the same line as the key anchor the key — and this grammar encodes exactly that: `annotated_node` admits a block collection only behind the `_indented` marker, so `&a` / newline / `  foo: 1` anchors the mapping and the same-line form anchors the key. It is the same rule YAML applies, so this is a deviation only in that the mechanism is a token rather than a production.'''
