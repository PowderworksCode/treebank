[package]
name = "treebank-yaml"
version = "0.1.0"
# Only the `treebank` crate is published. Everything else is a workspace
# member: the grammars ship as wasm packs and the CLI is not a library.
publish = false
edition = "2021"
license = "MIT"
description = "YAML 1.1 and 1.2 in one grammar, carrying the treebank node vocabulary"
repository = "https://github.com/PowderworksCode/treebank"
keywords = ["incremental", "parsing", "tree-sitter", "yaml"]
categories = ["parsing", "text-editors"]
build = "build.rs"
include = [
  "LICENSE",
  "bindings/rust/*",
  "grammar.js",
  "build.rs",
  "src/*.c",
  "src/*.json",
  "src/tree_sitter/*.h",
  "terms.json",
  "ledger.toml",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = "0.26"
serde_json = "1"
toml = "0.9"
