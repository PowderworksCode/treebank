# The grammar's evidence file: what it covers, what it is measured
# against, and every place it knowingly differs from the reference
# parser. Prose rather than data, which is why it is TOML.

language = 'python'
versions = '''
2.7 ∪ 3.x (through 3.13 syntax: match, PEP 695 type parameters and type aliases, except*, parenthesized with-items)'''
generate_cli = '0.26.12'
vocabulary = '0.1.0'
roles_note = '''
18 of 22 table-tier terms are threaded. Omitted: _type (python annotations are ordinary expressions — the vocabulary's own position), _modifier (python has no named modifier nodes yet; async/await are anonymous), _control_flow (unthreadable here: a supertype's members enter every position that references it, and clauses/jump-vs-branch positions are construct-specific — see the uncategorised reasons in roles.json). _clause MOVED to the facet tier in vocabulary 0.2.0 on exactly this evidence, gathered independently in python, rust and typescript; _control_flow remains the open candidate.'''
patterns_note = '''
match patterns are a dedicated sub-grammar (PEP 634), not the expression rules. The shapes reuse the destructuring node names by alias — `(tuple_pattern)`, `(list_pattern)`, `(star_pattern)` mean the same thing in `a, b = x` and in `case (a, b)` — but they are NOT threaded through the `_pattern` supertype, and that is a measured decision rather than an oversight: python's destructuring and match positions admit different member sets (`x[0]` and `*rest` destructure but do not match; `Point(x=0)` and `{'k': v}` match but do not destructure), and a supertype's members enter every position that references it. Routing them through `_pattern` made `a, Point(x=0) = z` parse, which CPython rejects. This is the `_clause` law in a second place; rust does not hit it because its `let` and `match` patterns are one set. Consequence: `(_pattern)` covers destructuring positions here, and match patterns are reached by their shared concrete names.'''
version_policy = '''
DESIGN.md §4.2: where a construct is valid only in an older version AND admitting it would change how current code parses, the current language wins. Three constructs are rejected on purpose — `f((a)=1)` (py3.0–3.7), bare `nonlocal` (py2), bare `await` (py2, py3.0–3.4). Declared with reasoning in version_policy.toml, gated by test/negative/, and booked by the sweep as `version` rather than `gap`. Older syntax with no competing reading in any later version stays ACCEPTED (`except E, e:`, py2 print/exec, backticks, old octal) — that is most of what the py2 half of the union is.'''
shape_check = '''
`treebank shape` compares our node BOUNDARIES and field edges against CPython `ast` over the whole locked corpus: 215,213,266 oracle nodes across 296,567 files, with 0 missed nodes, 0 kind mismatches, 0 unmapped nodes, 0 field mismatches and 0 unmapped fields after the Known Deviations in shape_policy.toml. Boundary misses started at 1,682,942. The positionless-node hull is token-aware: comments containing words such as `for` cannot extend a node, and parenthesized `withitem` nodes distinguish expression grouping from the outer with-item-list parentheses. 1,787 files are skipped: python2-only sources, and files whose PEP 263 coding declaration or BOM means `ast` reports offsets into a byte string that is not the one on disk.'''
mutation_check = '''
`treebank mutate` — 4,508 mutants over 594 corpus files, 102 widenings in 83 clusters. The sweep measures rejects-valid over 139,205 files; this measures the other direction, which test/negative/ had been measuring with eighteen hand-written ones.'''
error_positions = '''
`treebank errors` — 926 of 935 rejected files are comparable (both parsers reject): 205 exact, 535 within 16 bytes, 153 within 128, 33 further. Median |delta| 5 bytes. The tail is almost all jedi's completion fixtures, which are deliberately truncated snippets.'''
lexical_check = '''
`treebank shape` also compares TOKEN boundaries against CPython's `tokenize`, the only oracle we have below the tree. Zero disagreements once three f-string granularity differences are declared in shape_policy.toml. Three bugs were found building it, all in the checker: `tokenize` reports CHARACTER columns where `ast` reports UTF-8 BYTE columns; `splitlines()` breaks on \r\n, \x0c and \u2028 where the line table counts \n; and `tokenize` may emit a whitespace-only token for a bare `\r` plus spaces, which is trivia rather than a Treebank token boundary. One bug was found in the grammar: `comment` was `token(seq('#', /.*/))`, and tree-sitter's `.` excludes \n but MATCHES \r, so every comment in a CRLF file ended one byte late.'''
roundtrip_check = '''
`treebank roundtrip` — 139,205 files re-rendered through `ast.unparse` and reparsed: 137,968 rendered (1,237 declined by the printer, mostly python2-only sources), 3 failures. All three are the same ruff fixture vendored three times, and what it exposed is not a round-trip problem at all: `case y if a if True else b:` is a real gap, and the sweep had filed it as NOISE because the validity oracle uses `compile()`, which ALSO rejects the file for `'yield' outside function` -- a semantic check, not a syntactic one. `ast.parse` accepts the file. The oracle is stricter than a parser and has been understating gaps; correcting that is its own change.'''
oracle_blind_spot = '''
check.py judges with `compile()` deliberately -- its header sets out why, and states the cost: a file invalid for a POST-PARSE reason and holding a real grammar gap is recorded as noise rather than a gap. The sweep now measures that cost instead of assuming it small, by asking `ast.parse` about every noise file: the ones it accepts are syntactically valid, so our rejection of them is a gap the oracle cannot see. Measured at THREE files, one distinct construct -- a conditional expression as a match guard -- which is now fixed. The count is zero and is reported on every sweep, so it cannot grow unnoticed.'''
argument_ordering_analysis = '''
Enforcing `f(a=1, b)` as an error needs the argument list split into a positional group and a keyword group with DIFFERENT element sets -- that is what makes a positional after a keyword unreachable, and no precedence or dynamic precedence substitutes for it, because both readings are complete parses. Two element sets means two hidden rules. `_argument` is a TABLE-tier supertype and DESIGN.md §2 fact 4 records that supertype queries are derivation-based, so a rule can carry the role only where the parse flowed through it: whichever group is not `_argument` stops answering `(_argument)`. Verified by building it -- the grammar rejected `f(a=1, b)` correctly and the roles gate then failed on `keyword_argument` and `splat_argument`. The facet tier does not help either: facets are type-level, and a positional argument is a bare expression with no distinguishing node type, so no list of types can name it. The only shape that works is to give positional arguments a node of their own -- an `argument` wrapper -- and move `_argument` from the table tier to the facet tier over {argument, keyword_argument, splat_argument}, which are types that occur nowhere else. That is coherent and it is a cross-language vocabulary change: TypeScript and Rust have no keyword arguments and so need none of the ordering, but they would carry the wrapper and the tier move anyway. Recorded rather than taken.'''
fuzz_check = '''
`treebank fuzz` — programs derived from grammar.json and judged by CPython's PARSER (`ast.parse`, via validate_syntax_only) rather than by `compile()`. That distinction is the whole result: judged by `compile()` the run was dominated by `break`, `yield` and `* x` at module level, which CPython's parser accepts and its compiler rejects — no tree-sitter grammar should track loop nesting to reproduce those. Judged by the parser, 400 derivations gave 21 distinct shrunk programs, 4 of them the declared py2 union (fuzz_policy.toml) and the rest the five causes in known_widenings. All were confirmed against ast.parse.'''

incremental_check = '''
`treebank incremental` — 3000 files, 8898 edits (delete a run, insert a token, replace a run), reparsing after `Tree::edit` compared against a fresh parse of the same text. 0 diverged, 0 of them on text that still parses cleanly. The split is the result: an incremental reparse is exact whenever the edit leaves the file valid, and every divergence that exists is on text the edit broke, where error recovery and subtree reuse can stitch the same wreckage together more than one way. The gate is the clean half. This is the only check with a hard invariant rather than an oracle, and the only one that looks at the reparse path at all — every other one parses from scratch, so a grammar can pass all of them and still hand a broken tree to an editor.'''

recovery_check = '''
`treebank recovery` — 1978 files, 10920 single-token deletions that break the parse, measuring how much of the file lands inside an ERROR. Blast radius median 0.3%, p90 17.1%, p99 99.1%; 240 deletions put more than half of a file of at least 1 KiB inside an error, most often `"""` x59, `:` x34, `(` x23, `)` x22. A property rather than a comparison: no reference parser produces a recovered tree, so there is nothing to check against. The size floor was added after the first run counted `from a b` — which errors for two lines and recovers — as a shredding, because on a four-line file two lines is more than half; a percentage measures the file as much as the parser when the file is small.'''

[[known_gaps]]
construct = 'indentation that mixes tabs and spaces'
files = 1
note = '''
`def apply(self, inst, t):` indented with four spaces and its body with a tab. CPython's tokenizer expands a tab to the next multiple of eight when it measures indentation; the scanner asks tree-sitter for `get_column`, which counts CHARACTERS, so it reads the tab as column 1, sees 1 < 4, and dedents out of the body. The fix is to measure the indent run directly with CPython's rules (space +1, tab to the next multiple of 8, form feed resets to 0) instead of calling get_column. One file in 297,612, against the riskiest code in the repository to change, so it is written down rather than attempted.'''

[[known_gaps]]
construct = 'backslash continuation as the first line of a block'
files = 2
note = '''
`class C:` followed by a line holding only ` \\`, then `pass` at column 0 — the continuation joins them into one logical line indented by one space. Same scanner area as the tab gap: the indent is measured before the continuation is resolved. Also covers the `else:\\` fixture.'''
[corpus]
source = '''
top-1000 PyPI packages by download rank (hugovk top-pypi-packages), sdists only; 951 of 1000 publish one'''
files = 297612
packages = 1914
blind_to = '''
python2-only code (modern PyPI sdists are effectively py3-only, so the py2 half of the union leans entirely on the corpus tests and batteries); notebooks; scripts without .py extension'''
mutation_falsification = '''
while_statement deleted from _loop: 3,661 gap files (vs 23). star_pattern deleted from the match sequence rule: +4. escape_sequence allowed to consume a brace again: 29. Old and new rules alike can be falsified.'''
corpus_composition_note = '''
4 grammar gaps and 12 version-policy rejections. ruff, ty and ast-serialize each vendor ruff's parser test corpus, so every ruff fixture is counted three times: the 4 gaps are 2 distinct sources and the 12 rejections are 3. Exactly one gap file (dill/source.py) is ordinary library code; everything else here is an adversarial parser fixture.'''

[corpus.sweep]
files = 297612
passed = 296513
failed = 1099
gap_files = 7
noise_files = 1080
pass_rate = '99.63%'

[[oracles]]
family = 'python3'
tool = '''
tools/py-oracle/check.py under python3 (stdin batch, compile(src, path, 'exec'))'''
version = 'CPython 3.12.3'
role = 'primary; judges every file first'
horizon_note = '''
3.12 rejects syntax newer than itself: PEP 758 (3.14 parenthesis-free multi-except) appears in one black fixture and is booked as noise here; it becomes a gap the day the oracle is bumped, and the bump gets its own before/after sweep.'''

[[oracles]]
family = 'python2'
tool = '''
tools/py-oracle/check2.py under python2 (stdin batch, compile(src, path, 'exec'); the script is written in the py2/py3 common subset)'''
version = '''
CPython 2.7.18, built from source (Ubuntu 24.04 ships no python2 package)'''
role = '''
REQUIRED second leg of the union: every file python3 rejects is re-judged, and a file is valid if either accepts. The driver errors loudly if python2 is missing — a py3-only sweep books every py2-only file as noise, which silently hides the py2 half's gaps. Adding this leg surfaced 4 real gap files the py3-only sweep had mis-filed as noise.'''
battery = '''
test/negative-oracle/py3/ (print statement, backticks, 0777, except-comma) verified live: python3 rejects all four, python2 accepts all four. test/negative-oracle/py2/ (f-string, nonlocal, walrus) verified live in the reverse direction. The battery caught its own bad fixture on first run: bare `nonlocal x` with no enclosing binding is a SyntaxError in py3 as well, so the fixture gained the enclosing function it needed.'''
bug_found_by_widening = '''
The wider corpus crashed the py2 leg: a file with a NUL byte makes py2's compile() raise TypeError where py3 raises ValueError, and check2.py caught only the latter, so the oracle died instead of returning a verdict. A NUL in the source is a VERDICT (the bytes were read fine, they are just not python), not an oracle failure, so both are now caught. The loud-failure discipline worked exactly as designed — the sweep aborted rather than silently booking every python2 file as noise.'''

[[known_gaps]]
construct = "backslash continuations that change a suite's indentation"
files = 3
note = '''
CPython's rule here is neither 'the indent of the first physical line' nor 'the indent of the token'. Taking it from the first physical line (captured at the backslash) FIXES ruff's backslash_continuation_indentation (3 files) and BREAKS black's backslash_before_indent (6 files); the committed behaviour is the reverse trade. Measured both ways, kept the better one.'''

[[known_gaps]]
construct = 'TWO OR MORE consecutive comment lines after an inline suite'
files = 1
note = '''
One is tolerated. `repeat1` there HANGS the parser — the scanner emits a zero-width NEWLINE at EOF and an unbounded repeat over a zero-width token never terminates. dill/source.py has four.'''

[[deviations]]
what = '''
py2 chevron print `print >> f, x` takes the expression reading (a tuple whose head is a right-shift) — it is valid py3 syntax too, and the union prefers the py3 reading whenever both parse (print_statement carries prec.dynamic(-1))'''

[[deviations]]
what = '''
keywords that were identifiers in some version (True/False/None in py2, async/await before 3.7) are hard keywords here; `True = 5` (py2-valid) does not parse. Soft-keyword machinery exists for print/exec/match/case/type, which carry real corpus weight; the others measured no corpus incidence'''

[[deviations]]
what = '''
`x = 1; if y: pass` (invalid in every version) is accepted when it ends the file: the zero-width NEWLINE the scanner hands out at EOF satisfies the line wrapper the inline suite already consumed. One negative-corpus candidate removed for it; fix wants a smarter EOF rule'''

[[deviations]]
what = '''
inconsistent partial dedents (`if a:` at 0, body at 8, next line at 4) parse; CPython's tokenizer raises IndentationError. The scanner dedents to the nearest enclosing level'''

[[deviations]]
what = '''
escape_sequence never consumes a brace. CPython reads `f"\{foo}"` as a literal backslash followed by an interpolation that still opens, so an escape that swallowed the `{` lost the interpolation entirely; a lone backslash is its own (shorter) alternative, which tree-sitter's longest-match rule keeps out of the way of `\n` and friends.'''

[[deviations]]
what = '''
a format specifier may contain newlines. PEP 701 makes the whole interpolation multi-line inside a triple-quoted f-string, so the closing brace ends the spec rather than the line ending.'''

[[deviations]]
construct = '''
a BLANK line between an inline suite and its continuation clause, e.g. `if True: pass` / `` / `else:`'''
was = '''
the scanner emitted NEWLINE for the blank line. `if True: pass` opens no indent level, so the blank line never reached the INDENT/DEDENT branch that consumes such lines -- it fell through to the newline branch, and the spurious NEWLINE committed the shared GLR token stream before `else` could attach.'''
now = '''
NEWLINE is emitted only where a line with CONTENT ends: the call started past column 0 and has not already crossed a line boundary. CPython emits NL, not NEWLINE, for blank lines.'''
note = '''
Held as LOCAL state in the scan call, not scanner state: tree-sitter persists scanner state only after a call that RETURNS A TOKEN, so a flag cleared on the `return false` path is lost. A first attempt using a persistent flag failed exactly that way. No corpus file exercises it; committed as a correctness fix.'''

[[deviations]]
construct = '`f"{num:=10}"` -- a format spec beginning with `=`'
was = '''
after `f"{num` both `:` and `:=` were valid, and tree-sitter's longest-match rule handed the colon to the walrus: the whole family parsed as `named_expression`. CPython reads it as a width-10 format spec (`'         5'`).'''
now = '''
`format_specifier` opens with `token(prec(1, ':'))`. Lexical precedence outranks match length, so this colon wins wherever a format spec can start. It is a distinct token from the plain `:` of dicts, slices and annotations, and a PARENTHESISED walrus -- `f"{(x := 10)}"`, the only form CPython accepts here -- still lexes `:=` because no format spec is valid inside the parentheses.'''
note = '''
SILENT except where the spec was not itself a valid walrus right-hand side: only `f"{num:=.2Uf}"` errored, 1 file in mpmath.'''

[[deviations]]
construct = '`lambda x: A if c else B`'
was = '''
`(lambda x: A) if c else B` — the conditional wrapped the lambda instead of being its body.'''
now = '''
CPython's grammar reads `test: or_test ['if' or_test 'else' test] | lambdef`, so only the ELSE branch may be a bare lambda. `conditional_expression`'s consequence and condition now use an `_or_test` tier that excludes it.'''
note = '''
SILENT. Both readings held identical node multisets — one lambda, one conditional — so neither static nor dynamic precedence had anything to weigh; the fix had to remove the ambiguity.'''

[[deviations]]
construct = '`{lambda x: x: 1}`'
was = '''
a SET holding one lambda whose parameter was annotated `x: x` and whose body was `1` — the dict's own colon eaten as an annotation.'''
now = '''
lambda parameters carry no annotations, which is what Python says, so this is a dict with a lambda key.'''
note = '''
SILENT, and a widening as well: annotated lambda parameters were accepted.'''

[[deviations]]
construct = '`x = int,` followed by another statement'
was = '''
the tuple ran across the line break: `x = int,` / `y = 1, 2` became the single chained assignment `x = (int, y) = (1, 2)`. Two statements silently became one.'''
now = '''
`prec.right` on `_comma_expressions` had resolved `expr , .` in favour of shifting, which REMOVED the reduce action, so `_newline` was no longer a valid lookahead there and the scanner was never asked for one. Without it the scanner is consulted; a `prec.dynamic` on the tuple then decides the remaining GLR tie, which the two readings differ in — two tuples versus a tuple and a pattern_list.'''
note = 'SILENT.'

[[deviations]]
construct = 'a comment between a block and the next statement'
was = '''
the block above owned it, so `if_statement` and `function_definition` spans ran past the construct to the start of the next one. Asking for a statement's source text returned a comment that is not part of it.'''
now = '''
the scanner closes open blocks in front of a comment whose next line of CODE is dedented, skipping comment and blank lines for that decision the way CPython's tokenizer does. Not before a continuation clause: `elif`/`else`/`except`/`finally` mean the statement is not over, and closing early kills the fork waiting for the clause.'''
note = 'Matters most to anything that re-emits code.'

[[deviations]]
construct = 'a conditional expression as a match guard, `case y if a if True else b:`'
was = 'rejected. The guard was `_no_conditional_expression`.'
now = '''
the guard is `$._expression`. CPython's grammar reads `guard: 'if' named_expression`, and a named_expression is a full expression, so a conditional is legal there. Lambda, walrus and yield guards still parse.'''
note = '''
Invisible to the sweep: the only corpus file carrying it is ALSO invalid to `compile()` for an unrelated reason (`yield` outside a function), so it was filed as noise. Found by the round-trip check and then by measuring the oracle's own documented blind spot.'''

[[known_widenings]]
construct = '`f(a=1, b)` — a positional argument after a keyword argument'
found_by = 'mutate'
why_accepted = '''
`arguments` is a flat comma list of `_argument`, so nothing orders the two kinds. CPython rejects it: "positional argument follows keyword argument".'''
why_not_fixed = 'see `argument_ordering_analysis` in this ledger.'

[[known_widenings]]
construct = "a malformed hex escape, `'\\x'`"
found_by = 'mutate'
why_accepted = '''
`escape_sequence` has a lone-backslash alternative, needed so `f"\{foo}"` keeps its interpolation.'''
why_not_fixed = '''
removing the fallback breaks the f-string case; rejecting it needs the string scanner to stop differently.'''

[[known_widenings]]
construct = 'a keyword literal as an attribute name, `a.None` / `a.True`'
found_by = 'mutate (replace `=` with `.`)'
why_accepted = '''
at the property position only `identifier` is valid, so tree-sitter's keyword extraction does not apply and `None` lexes as an ordinary identifier.'''
why_not_fixed = '''
excluding three specific words from a token needs negative lookahead, which tree-sitter's regex engine does not have. The alternatives are an external-scanner identifier token or a per-position exclusion list, both disproportionate. `a.True` is also valid python2, so §4.2 applies to it as well.'''

[[known_widenings]]
construct = '''
starred expression where only a plain expression belongs — `assert * XX`, `if * XX : XX`, `while * XX : XX`, `* XX if XX else XX`'''
found_by = '''
fuzz (derived from the grammar, shrunk, confirmed against CPython ast.parse)'''
why_accepted = '''
`*x` is reachable from the general expression position rather than only from the contexts that unpack (call arguments, assignment targets, sequence displays).'''
why_not_fixed = '''
FIXED. `starred_expression` is out of `_expression` and written out at each position that takes it -- call arguments, displays, subscripts, comma lists, and a PEP 646 variadic annotation. Written out rather than hidden behind a rule: a hidden rule is a unit reduction, and at `(yield x , …)` that reduction must happen before the parser can tell a yielded expression from a collection element.'''

[[known_widenings]]
construct = 'conditional expression where a target belongs — `del XX if XX else XX`'
found_by = '''
fuzz (derived from the grammar, shrunk, confirmed against CPython ast.parse)'''
why_accepted = '''
the `del` target list admits a full expression. CPython: `cannot delete conditional expression`.'''
why_not_fixed = '''
FIXED. `del` takes `_left_hand_side` rather than the expression tier.'''

[[known_widenings]]
construct = 'augmented assignment to a tuple — `XX , += XX`'
found_by = '''
fuzz (derived from the grammar, shrunk, confirmed against CPython ast.parse)'''
why_accepted = '''
the augmented-assignment target admits an expression list. CPython: `'tuple' is an illegal expression for augmented assignment`.'''
why_not_fixed = '''
FIXED for `a, b += 1` and `[a] += 1`; the target is now a single name, attribute, subscript or parenthesized expression. `(a + b) += 1` is still accepted -- spelling the parentheses into the target rule instead would need four declared conflicts, and a declared conflict also switches static precedence off in this grammar.'''

[[known_widenings]]
construct = '`return yield`'
found_by = '''
fuzz (derived from the grammar, shrunk, confirmed against CPython ast.parse)'''
why_accepted = 'a bare `yield` is reachable as the returned expression.'
why_not_fixed = '''
NOT FIXED, and removing `yield_expression` from `return` does not fix it: tree-sitter prefers an extracted keyword only where the keyword is valid, so with `yield` no longer a legal continuation the lexer falls back to `identifier` and the program parses as returning a variable named `yield` -- the same acceptance wearing a worse tree. Rejecting it needs `yield` to be unable to lex as an identifier anywhere, which is what tree-sitter's `reserved` word sets are for.'''

[[known_widenings]]
construct = '''
walrus with a conditional right-hand side at statement level — `XX := XX if XX else XX`'''
found_by = '''
fuzz (derived from the grammar, shrunk, confirmed against CPython ast.parse)'''
why_accepted = '''
named_expression's value is the full expression tier rather than the tier below the conditional.'''
why_not_fixed = 'queued.'

[[known_widenings]]
construct = "starred operand tier differs by position — `[*a if b else c]`"
found_by = 'fuzz (derived from the grammar, shrunk, confirmed against CPython ast.parse)'
why_accepted = '''
`starred_expression` is `'*' _expression`, so its operand may be a conditional everywhere. CPython splits it: a call argument is `'*' expression` and takes one, while a display element is `'*' bitwise_or` and does not — `f(*a if b else c)` is valid and `[*a if b else c]` is not.'''
why_not_fixed = '''
queued. Needs two starred rules, one per operand tier.'''

[[known_widenings]]
construct = '`del *a`'
found_by = 'fuzz (derived from the grammar, shrunk, confirmed against CPython ast.parse)'
why_accepted = '''
`del` now takes `_left_hand_side`, which is right for `del a, b[1], c.d` and still admits `star_pattern`. CPython: `cannot delete starred`.'''
why_not_fixed = '''
FIXED. `del` has its own target set now, the assignment targets minus the star.'''
