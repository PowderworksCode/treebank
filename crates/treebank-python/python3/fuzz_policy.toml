rule = '''
Over-acceptance this grammar commits to ON PURPOSE, as prefixes of the shrunk program `treebank fuzz` reports. Entries must be as narrow as the decision they record: a blanket prefix silences the real finding that turns up next month wearing similar clothes, which is how a check like this quietly stops working. Every entry names the decision it follows from, and that decision is in ledger.json — not invented here to make a number go down.'''

emptied_by_the_variant_split = '''
This file held three entries and now holds none, and that is the split
paying out rather than a policy being relaxed.

All three — `print `, `exec ` and `lambda (` — were py2 forms declared as
deliberate widenings because one table had to be 2.7 ∪ 3.x, so the fuzzer
(which judges against CPython 3) reported them and the ledger had to say
"meant to be". With python 2 in its own table they are simply not python 3
syntax any more: this grammar rejects all three, CPython 3 rejects all
three, and there is nothing left to declare.

A declared widening is a promise that a check will keep reporting something
harmless. Three such promises expiring at once is the clearest measure of
what the union was costing here — the fuzzer can now report a `print `
finding and mean it.'''
