# Over-acceptance this grammar commits to on purpose, as prefixes of the
# shrunk program `treebank fuzz` reports. Narrow entries only: a blanket
# prefix silences the real finding that turns up wearing similar clothes.

rule = '''
Over-acceptance this grammar commits to ON PURPOSE, as prefixes of the shrunk program `treebank fuzz` reports. Entries must be as narrow as the decision they record: a blanket prefix silences the real finding that turns up next month wearing similar clothes, which is how a check like this quietly stops working. Every entry names the decision it follows from, and that decision is in ledger.json — not invented here to make a number go down.'''

[[declared]]
starts_with = 'print '
why = '''
py2 print statement. This grammar is 2.7 ∪ 3.x by design (ledger.versions), so a py2 statement form is a widening against py3's parser and is meant to be one.'''

[[declared]]
starts_with = 'exec '
why = 'py2 exec statement; same union decision as `print`.'

[[declared]]
starts_with = 'lambda ('
why = '''
py2 tuple parameters: `lambda (x, y): x` destructures its argument in 2.7 and is `Lambda expression parameters cannot be parenthesized` in 3.x. Same union decision as `print` (ledger.versions); the fuzzer judges against the py3 parser, so the py2-only form reports as a widening and is meant to.'''
