[[oracles]]
family = 'ruby'
tool = 'RubyVM::AbstractSyntaxTree.parse_file, via tools/rb-oracle/check.rb'
version = 'CRuby 3.3.6'
role = '''
primary and only. It runs the same parser `ruby` runs and stops at the AST: no require, no execution, no constant resolution, so a missing gem is not an error and a file is judged entirely on its own text. The interpreter's version decides what counts as valid Ruby and is a real knob — `it` blocks are 3.4+, `{x:}` shorthand is 3.1+, endless methods 3.0+ — so a file needing newer syntax than the oracle's interpreter is recorded as noise, an answer about the toolchain rather than the grammar. Verified rather than assumed: `File.write(...); raise "ran"` parses valid and writes nothing, and neither `BEGIN {}` nor `at_exit {}` fires.'''

[deviations]
extras_heredoc = '''
`heredoc_body` sits in `extras`, an exception to DESIGN.md §4.1's comments-and-whitespace rule, declared here: a heredoc's body physically lies between the newline that ends its operator's line and the next line — between tokens of unrelated constructs — and an extra is the only placement the parse table offers for that. The scanner only produces one while a heredoc operator is actually pending.'''
known_gaps = '''
Constructs known missing or approximated, each ledgered when found on the corpus: `?a` character literals adjacent to ternaries (`a ?b : c`) mis-lex; `%=…=` percent literals are refused so `a %= b` stays an operator; `def f (a)` with a space reads the parens as a destructuring parameter (CRuby itself warns on the form); `def f a\nend`-style paren-less one-liners accept a body on the same line (`def f(a) x end`), a widening CRuby rejects, taken so that a definition's own newline never competes with its body's (one owner per newline); `a!=b` written without spaces lexes as `a != b` correctly, but `:sym=~x` families rely on one-character lookahead in the scanner. The parameter list accepts orderings CRuby rejects (`def f(&b, a)`) — the ordering chain python's parameterRules spells out is the known fix, and until then `_parameter` stays honestly in the table tier.

From the do-attachment design: a paren'd argument list accepts a COMMAND with a do-block (`f(foo bar do end)`), which CRuby rejects — the single-command slot does not distinguish the spellings; and subscripting a do-block call directly (`list.map do … end[0]`) is a gap, because the chain family carries members and calls but not subscripts (its cross-recursion multiplied table generation past use). A bare lowercase heredoc after a value (`a <<b`) is now read as CRuby reads it — a heredoc when whitespace precedes the `<<`, the shift when glued — and the spaced global-scope `::` follows CRuby's lexer the same way (glued to a value it chains, spaced or at a beginning it opens the global scope), warnings and all.'''
