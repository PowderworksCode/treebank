[package]
name = "treebank-oracle"
version = "0.1.0"
# Only the `treebank` crate is published. Everything else is a workspace
# member: the grammars ship as wasm packs and the CLI is not a library.
publish = false
edition = "2021"
license = "MIT"
description = "Reference-parser oracles: is this file valid <language>? One pinned oracle per language, all behind one trait. Self-contained so it can move out of this repo."

[dependencies]
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit", "parsing"] }
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
treebank-lang = { path = "../treebank-lang" }
