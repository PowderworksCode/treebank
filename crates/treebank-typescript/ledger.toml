# The grammar's evidence file: what it covers, what it is measured
# against, and every place it knowingly differs from the reference
# parser. Prose rather than data, which is why it is TOML.

language = 'typescript'
versions = '''
the TypeScript ∪ JavaScript ∪ JSX union, every TS version through 5.x syntax (satisfies, const type params, accessor, infer constraints, template literal types, import attributes) in ONE parser'''
dialect_decision = '''
One parser for TS + JS + JSX. The DESIGN.md §4.2 dialect split existed for the `<T>` ambiguity, and this ledger previously justified skipping it by measuring angle-bracket CASTS at zero incidence in the top-300. That measurement was right and the conclusion was wrong: the top-1000 corpus has 11+ files of GENERIC ARROW FUNCTIONS (`const f = <T extends X>(x: T) => x`, in zod and rxjs), which hit the same ambiguity and are ordinary modern style. They now parse in the single grammar. The fix was not precedence but a token collision: `_jsx_identifier` and `identifier` matched the same text, so the LEXER chose JSX before the parser could fork — the same trap the rust ledger records for identifier/type_identifier. With plain JSX names lexing as the ordinary identifier and only dashed names getting their own token, GLR forks and jsx_opening_element's negative dynamic precedence yields to the arrow whenever both complete. Casts remain a ledgered gap at 0 measured files.'''
generate_cli = '0.26.12'
vocabulary = '0.1.0'
roles_note = '''
21 of 22 table-tier terms thread — _control_flow nests in _statement (like python, unlike rust's expression-orientation), _member routes through _declaration in class bodies, _modifier has seven members (accessibility/readonly/static/abstract/override/declare/accessor: TS is the most modifier-rich language yet). _clause was the one unthreadable term — the third language to record the same evidence — and MOVED to the facet tier in vocabulary 0.2.0, with seven members here (else/case/default/finally/catch/import/export clauses).'''
shape_check = '''
`treebank shape` compares our node BOUNDARIES against tsc's over the whole corpus: 3,128,811 oracle nodes across 11,976 files. 3,229 missed boundaries at introduction, 23 now — the remaining 6 files are recorded under known_limits in shape_policy.toml, each a GLR tie where the two readings hold identical node multisets so dynamic precedence has nothing to weigh. Declared granularity differences (places our tree groups differently on purpose) are `<TscKind> <- <our_kind>` pairs in the same file, each read by hand. Every fix has a fixture under test/shape/, checked in CI with a ceiling of zero.'''
mutation_check = '''
`treebank mutate` — 3,877 mutants over 500 corpus files, 57 widenings in 30 clusters.'''
error_positions = '''
`treebank errors` — 6 of 12 rejected files are comparable: 1 exact, 4 within 128 bytes, 1 further. Median |delta| 106. Every outlier is the same construct, `export = function ...`: we report at the `export =` and tsc at the `function`.'''
roundtrip_check = '''
`treebank roundtrip` — all 11,988 files re-rendered through `ts.createPrinter` and reparsed: 11,982 rendered, 4 failures, and every one is a gap already recorded under known_gaps (the `symbol` parameter in a bare function type, and the angle-bracket cast). The canonical spelling of everything else parses, which is the result worth having: the check doubled the corpus with source no human wrote and found no new construct.'''

incremental_check = '''
`treebank incremental` — 3000 files, 9000 edits (delete a run, insert a token, replace a run), reparsing after `Tree::edit` compared against a fresh parse of the same text. 0 diverged, 0 of them on text that still parses cleanly. The split is the result: an incremental reparse is exact whenever the edit leaves the file valid, and every divergence that exists is on text the edit broke, where error recovery and subtree reuse can stitch the same wreckage together more than one way. The gate is the clean half. This is the only check with a hard invariant rather than an oracle, and the only one that looks at the reparse path at all — every other one parses from scratch, so a grammar can pass all of them and still hand a broken tree to an editor.'''

recovery_check = '''
`treebank recovery` — 1993 files, 11435 single-token deletions that break the parse, measuring how much of the file lands inside an ERROR. Blast radius median 0.5%, p90 17.5%, p99 94.1%; 60 deletions put more than half of a file of at least 1 KiB inside an error, most often `}` x15, `{` x13, `import` x8, `/` x5. A property rather than a comparison: no reference parser produces a recovered tree, so there is nothing to check against. The size floor was added after the first run counted `from a b` — which errors for two lines and recovers — as a shredding, because on a four-line file two lines is more than half; a percentage measures the file as much as the parser when the file is small.'''

fuzz_check = '''
`treebank fuzz` — the first runs over this grammar. 8 distinct shrunk programs, all confirmed against tsc: `try { }` with neither catch nor finally, `for await (x in y)`, `override var x`, and a `function ( ) ;` family. Four are fixed and the count is 4. What remains is one cause: the keyword-less method form is reachable at STATEMENT level, so `function ( ) ;` and `foo ( ) { }` both parse — `function` lexes as an identifier where the keyword is not valid, and the method form picks it up. The fix is the `_declaration` refactor the grammar already carries a note about, and that note understates it: class members route through `_declaration` on purpose so a method answers `(_declaration)`, and splitting the rule drops that.'''
[corpus]
source = '''
top-1000 npm packages by download rank, both corpora (typescript: .ts/.tsx; javascript: .js/.mjs/.cjs/.jsx, minified excluded)'''
blind_to = '''
npm ships mostly compiled .js + .d.ts, so the TS corpus is declaration-file-heavy (undici-types, type-fest) and light on application .ts; JSX incidence is low outside React-adjacent packages'''
mutation_falsification = '''
javascript with while_statement deleted from _loop: 429 gap files (vs 8). typescript with the _type_member_end token removed: 20 gap files (vs 13). Both the oldest and the newest rules can be falsified.'''
widening_note = '''
Widened from the top-300 to the top-1000: typescript 1,598 -> 11,988 files, javascript 4,801 -> 25,297. It found six real families the narrow corpus had no instance of, the largest of which invalidates a claim this ledger used to make (see dialect_decision).'''

[corpus.typescript_sweep]
files = 11988
passed = 11976
failed = 12
gap_files = 6
noise_files = 6
pass_rate = '99.90%'

[corpus.javascript_sweep]
files = 25297
passed = 25289
failed = 8
gap_files = 8
noise_files = 0
pass_rate = '99.97%'

[[oracles]]
family = 'typescript'
tool = '''
tools/ts-oracle under node (ts.createSourceFile parseDiagnostics — syntax-only, .d.ts-safe)'''
version = "typescript 5.x (pinned by the oracle's package-lock)"
role = 'judges .ts/.tsx/.mts/.cts'

[[oracles]]
family = 'javascript'
tool = '''
tools/js-oracle under node (V8 via vm, CJS/ESM picked by module rules, @babel/parser leg for JSX)'''
version = 'node 22 V8'
role = '''
judges .js/.jsx/.mjs/.cjs — deliberately NOT the TypeScript parser, which would bless TS syntax in .js files'''

[[known_gaps]]
construct = '''
a parameter NAMED `never`/`unknown`/`symbol` inside a bare function type, e.g. `(symbol: ts.Symbol) => boolean`'''
files = 3
note = '''
TypeScript reserves none of the three, so this is valid. Giving them an identifier reading fixes it and breaks `expectTypeOf<t1>().toEqualTypeOf<unknown>()` far worse: the identifier reading creates a competing generic-arrow fork that wins and the type-argument reading dies. Measured 10 -> 23 gap files. Held as a gap deliberately.'''

[[known_gaps]]
construct = '''
ambient `declare class C { clear(): void\n [Symbol.iterator]: ... }` — a bodyless method followed by an index signature'''
files = 2
note = '''
`class_body` separates members by nothing, because an ordinary method ends in `}`. An ambient method ends in a TYPE, so `void` and the next `[` merge into one indexed_access_type. Adding `optional($._type_member_end)` to `class_body` generates cleanly but the token is never offered in that state, with or without the scanner's ASI guard. Both files are undici-types.'''

[[known_gaps]]
construct = 'legacy `<T>x` angle-bracket casts'
files = 1
note = '''
the dialect-split construct; one file in 11,988. Accepted as a gap by design — see dialect_decision.'''

[[known_gaps]]
construct = '''
a generic arrow whose type parameter carries an `extends` constraint at the head of a call argument'''
files = 1

[[deviations]]
what = '''
one parser instead of the typescript/tsx dialect pair; JSX is grammatical in .ts files (tsc rejects it there) — union-widening traded for a single table, justified by the zero measured cast incidence'''

[[deviations]]
what = '''
class methods are function_definition (python/rust precedent: same construct, same name), class members route through _declaration so a method answers (_declaration), (_member) and the _callable facet alike'''

[[deviations]]
what = '''
ASI is a static continuation set in the scanner (the flip side of the hazard list: ( [ ` + - * / % < > = & | ^ ? : , . in instanceof as satisfies extends), with ++/-- forcing insertion; spec-ASI's can-the-parse-continue rule is approximated, which costs exactly the one ledgered hazard file'''

[[deviations]]
what = '''
expression statements exclude function/class/{ at the first position structurally — the JS spec rule, enforced in the grammar rather than by dynamic precedence (which measured as unable to win the fork)'''

[[deviations]]
what = '''
`T?` is a tuple-ELEMENT form, not a general type. TS only allows it there, and admitting it to the type tier let `x < -1 ? p : q` fork into a type-argument reading that outlived the expression one — 3 corpus files.'''

[[deviations]]
what = '''
`void`, `never`, `unknown` and `symbol` are a predefined_type node rather than identifiers. `void` is a unary operator, so it can never arrive as an identifier and `f<void>()` previously had no reading at all.'''

[[deviations]]
what = '''
object-type members are separated by a scanner token (_type_member_end) as well as , and ;. It carries ASI's continuation set with exactly one token flipped: `[` CONTINUES an expression (`foo` newline `[0]` is a subscript) and BEGINS a type member (an index signature). That single difference is why it is a separate token rather than reusing ASI, and it is what finally closed the 5-file .d.ts family — a precedence attempt had regressed 20 files, and a first version of this token with NO continuation set regressed to 100 by severing every multi-line member type.'''

[[deviations]]
what = '''
`string` is a `_literal` here and is NOT one in python, and that asymmetry is correct rather than a drift: typescript's string is a single token that cannot interpolate, so it satisfies the vocabulary's per-rule test ('determined by its own text, for EVERY instance of the rule'), while python's `string` rule carries f-strings and so cannot. It was excluded here by oversight until vocabulary 0.3.0 measured it. The `_string` facet exists because of exactly this: `(_literal)` is not comparable across languages for strings, and `(_string)` is.'''

[[deviations]]
construct = '`x as A & B` / `x as A | B`'
was = '''
`union_type` and `intersection_type` sat at prec 2 and 3, below PREC.cast (15), so the parser reduced `as_expression` at the operator and read the rest as a bitwise-and/or over an object literal. `x as A & B` produced `(x as A) & B`.'''
now = '''
both operators sit above `cast` (`&` still tighter than `|`), giving `as_expression(intersection_type(A, B))`.'''
note = '''
SILENT: the wrong tree is well-formed, so the sweep never flagged it. Only `x as A & { c?: B }` errored, because `?` is illegal in an object literal. Found by chasing that one file.'''

[[deviations]]
construct = '`a(): asserts this is X` inside an object type'
was = '''
`asserts` was reachable as a bare type name, so the member looked complete after it and `_type_member_end` was valid there. The external scanner is not forked by GLR, so it cut the member and the predicate reading died before the parser saw it — shredding into four bogus property_signatures.'''
now = '''
`asserts` and `is` reach identifier position only, via `_value_word`; `predicate_type` now requires `asserts` or `is` rather than deriving a bare name.'''
note = '''
SILENT for the same reason: four property_signatures is well-formed. Only the generic form `asserts this is X<Y>` errored.'''

[[deviations]]
construct = 'a comment between two object-type members'
was = '''
the scanner skipped whitespace and then judged by the next character; a comment starts with `/`, which is in both continuation sets, so the boundary was suppressed and `void /*c*/ [Symbol.iterator]` became one indexed_access_type.'''
now = '''
`skip_trivia` skips line and block comments too, and counts a line terminator inside a block comment as crossed.'''
note = '''
no corpus file exercises the interface form; committed as a correctness fix, not a number.'''

[[deviations]]
construct = 'object type members with no separator, e.g. `{ a: X b: Y }`'
was = '''
the separator was `optional` on every member, so juxtaposition parsed. tsc rejects it. `readonly` is a soft keyword and so a legal property name, so with juxtaposition allowed `readonly maxSize: number` had a second reading as TWO members and sometimes took it.'''
now = '''
only the LAST member may omit its separator. Requiring it then exposed `(` and `<` sitting in the type-member continuation set, so `interface I { (a: X): Y\n (a: Z): W }` and multi-line generic call signatures had no boundary; both are out of the set now, as `[` already was.'''
note = 'SILENT. Found by the shape check.'

[[deviations]]
construct = '`new Date().getFullYear()`'
was = '''
`new (Date().getFullYear())`. The constructor was `$._expression`, so the call bound into it.'''
now = '''
the constructor is its own tier — the member chain over a primary expression, the spec's MemberExpression. Precedence cannot express it: `member` must bind INTO the constructor while `call` must not.'''
note = '''
SILENT, ~29 files. Our own corpus tests had it RECORDED as `new (Service())` and had been passing for it — hand-written expectations cannot catch a mis-parse the author did not already know about.'''

[[deviations]]
construct = '`x as React.ReactElement`'
was = '''
`(x as React).ReactElement`, a member access on a cast. Same family as `x as A & B`.'''
now = '''
`prec.dynamic(1)` on `nested_type_identifier`. `[member_expression, nested_type_identifier]` is a DECLARED conflict, so static `prec` is never consulted for it — `prec(PREC.member + 1)` changed nothing at all.'''
note = 'SILENT, 73 files. Found by the shape check.'

[[deviations]]
construct = '`try { } catch (e) { }`'
was = '''
a `try_statement` with NO catch clause, followed by an unrelated `function_definition` named `catch`. The clause was simply absent from the tree.'''
now = '''
`catch_clause` and `finally_clause` at `prec.dynamic(2)`, above `function_definition`'s method form.'''
note = 'SILENT, 66 files. Found by the shape check.'

[[deviations]]
construct = '`readonly string[] | undefined`'
was = '''
`readonly (string[] | undefined)`. A REGRESSION introduced by the fix that raised the type operators above `PREC.cast`: that also lifted them above `type_operator`, which sat at 2.'''
now = '''
`type_operator` at `PREC.cast + 3`, tighter than intersection, which is tighter than union.'''
note = '''
SILENT, 119 files, introduced and caught within the same day. The argument for the shape ratchet in one line.'''

[[deviations]]
construct = '`foo();` — any zero-argument call statement'
was = '''
a bodyless `function_definition` named `foo`. The keyword-less method form is reachable at statement level, because members route through `_declaration`, and one blanket `prec.dynamic(1)` made it beat the call. `foo(1, 2)` was fine — number literals cannot be parameters — so only the argument-less case collided, and it collided everywhere.'''
now = '''
`function_definition` splits into three alternatives; the BODYLESS method form takes `prec.dynamic(-1)` and loses to the call.'''
note = '''
SILENT and invisible to the shape check too: `function_definition` and `expression_statement` span the same bytes and only the KINDS differ. Found by reading a shape fixture's tree by eye. Recorded because it marks the boundary of what a boundary check can do.'''

[[known_widenings]]
construct = '''
a top-level declaration with no `function` keyword, `declare foo(): void`'''
found_by = 'mutate (delete `function`)'
why_accepted = '''
the keyword-less method form of `function_definition` is reachable at statement level, because class members route through `_declaration` and statements use the same rule.'''
why_not_fixed = '''
the same shape as the `f(a=1, b)` problem in python, and blocked on the same thing. Splitting the method form out of `_declaration` means a second hidden rule, and `_declaration` is a table-tier supertype -- derivation-based -- so whichever side does not route through it stops answering `(_declaration)`. Methods answering `(_declaration)` is deliberate and documented in the grammar. Left as a decision to take rather than one to slip in.'''
