[package]
name = "treebank-lang"
version = "0.1.0"
# Only the `treebank` crate is published. Everything else is a workspace
# member: the grammars ship as wasm packs and the CLI is not a library.
publish = false
edition = "2021"
license = "MIT"
description = "The canonical language names treebank's crates agree on."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
