[package]
name = "treebank"
version = "0.2.1"
edition = "2021"
license = "MIT"
homepage = "https://treebank.dev"
repository = "https://github.com/PowderworksCode/treebank"
documentation = "https://docs.rs/treebank"
keywords = ["tree-sitter", "parser", "grammar", "wasm", "syntax"]
categories = ["parsing", "development-tools", "wasm"]
readme = "README.md" 
# The abi-2 regression fixture is 673 KB and exists to prove this crate still
# drives a pack that predates queries. It is worth its weight in git, where it
# is frozen on purpose, and worth nothing in the published tarball -- nobody
# downloading the crate runs its tests.
exclude = ["tests/fixtures/pack-abi-2.wasm"]
description = "The treebank vocabulary as code and data: the closed term lists, the roles.json facet manifest schema, the vocabulary-conformance checker, and facet query expansion."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The pack loader. Optional because the vocabulary half of this crate is
# useful without a parser, and an engine is a large dependency to impose on
# someone who only wants to expand a facet query.
#
# wasmer rather than wasmtime, and the reason is cross-compilation: wasmtime's
# own build.rs compiles C helpers whenever `runtime` and `std` are on -- which
# is every configuration that can execute wasm -- so building it for musl needs
# a musl C cross-compiler on PATH. Straitjacket ships static musl binaries for
# x86_64 and aarch64 from a plain `cargo build`, with no cross toolchain and no
# container, and could not host a pack at all while this crate required one.
# wasmer's tree compiles no C, so both targets cross-build with rust-lld alone.
wasmer = { version = "7", optional = true, default-features = false, features = ["sys", "cranelift"] }
# Not used directly. wasmer pulls blake3, whose build.rs compiles NEON assembly
# with cc on aarch64 -- which needs `aarch64-linux-musl-gcc` and so breaks the
# aarch64 musl cross-build that swapping to wasmer exists to make possible.
# `pure` selects the Rust implementation instead, and naming blake3 here is what
# unifies that feature across the whole graph, including for consumers that do
# not know blake3 is in their tree.
blake3 = { version = "1", optional = true, default-features = false, features = ["pure"] }

# Fetching grammars. Same versions the rest of the workspace already uses, so
# a checkout does not carry two HTTP stacks.
ureq = { version = "2", optional = true, features = ["native-certs", "proxy-from-env"] }
sha2 = { version = "0.10", optional = true }

[features]
default = ["pack", "fetch"]
pack = ["dep:wasmer", "dep:blake3", "dep:sha2"]
# Downloading a grammar rather than being handed one. Implies `pack`, since
# what is fetched is a pack.
fetch = ["fetch-bytes", "pack"]
# Acquisition without an engine: the manifest, the cache and the hash check,
# handing back bytes. For a host with its own runtime, so that reusing this
# does not mean linking a second engine beside the one it already has.
fetch-bytes = ["dep:ureq", "dep:sha2"]

[dev-dependencies]
sha2 = "0.10"
