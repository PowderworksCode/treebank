[package]
name = "treebank-corpus"
version = "0.1.0"
edition = "2021"
description = "Corpus acquisition: rank an ecosystem's packages, fetch their tarballs, extract source files, write the manifest sweeps consume. Self-contained so it can move out of this repo."

[dependencies]
rayon = "1"
anyhow = "1"
bzip2 = "0.6.1"
csv = "1"
flate2 = "1"
liblzma = { version = "0.4.7", features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
treebank-lang = { path = "../treebank-lang" }
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
