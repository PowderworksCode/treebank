[package]
name = "treebank-corpus"
version = "0.1.0"
# Only the `treebank` crate is published. Everything else is a workspace
# member: the grammars ship as wasm packs and the CLI is not a library.
publish = false
edition = "2021"
license = "MIT"
description = "Corpus acquisition: rank an ecosystem's packages, fetch their tarballs, extract source files, write the manifest sweeps consume. Self-contained so it can move out of this repo."

[dependencies]
rayon = "1"
anyhow = "1"
bzip2 = "0.6.1"
csv = "1"
flate2 = "1"
liblzma = { version = "0.4.7", features = ["static"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
treebank-lang = { path = "../treebank-lang" }
# `native-certs` and `proxy-from-env` are not optional extras here: without
# them this crate is the only thing in the repository that cannot fetch from
# behind a TLS-inspecting or proxied network. ureq's default agent trusts a
# BAKED-IN root list and ignores HTTPS_PROXY, so on any machine where the
# egress is re-terminated -- a corporate proxy, a CI sandbox -- every rank and
# fetch dies with `invalid peer certificate: UnknownIssuer` while git, cargo
# and curl on the same machine work. Reading the platform trust store and the
# proxy environment is what every other tool here already does.
ureq = { version = "2", features = ["json", "native-certs", "proxy-from-env"] }
zip = { version = "8", default-features = false, features = ["deflate"] }
