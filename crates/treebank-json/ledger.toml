grammar_revision = '9be90f554815468474480154ee3dc1f899de135e'

[[oracles]]
family = 'json'
tool = 'serde_json 1.0.151, in-process, `from_slice::<serde_json::Value>`'
version = "pinned by this workspace's Cargo.lock"
role = '''
JSON's oracle problem is the opposite of every other language's here, and the ledger should say so plainly: zig has one reference parser because it has one compiler, and JSON has hundreds and no owner. "The reference implementation" is therefore not a fact to look up. It is a choice, and the only honest way to make a choice like that is to MEASURE the candidates against a suite somebody else answered.

Over JSONTestSuite's determinate files — 95 must-accept, 188 must-reject:

- serde_json 1.0.151 `from_slice::<Value>`: 95 accepted, **0** must-rejects accepted.
- CPython 3 `json.loads`: 95 accepted, **3** must-rejects accepted — `NaN`, `Infinity`, `-Infinity`, which its own documentation calls an extension.
- jq 1.7: 95 accepted, **22** must-rejects accepted. Twenty are number-literal widenings (`.2e-3`, `+1`, `-01`, `2.e3`, `0.e1`, `NaN`, `Inf`) and two are multi-value input (`[][]`, `{"a": true} "x"`).

jq is disqualified exactly where it would hurt most. The number literal and the top level are the two places a JSON grammar is most likely to be too permissive, and jq is blind in both — as a stream processor it is an NDJSON parser by design. An oracle blind in those two places would excuse precisely the bugs this one exists to catch, and would have said nothing about the `extras`, `string_content` and closing-quote defects the negative corpus found. Python's `json` is a smaller version of the same failure.

Being a LIBRARY rather than a binary is the second reason and it is not a convenience. Every other oracle in this crate hopes the right version of some tool is on PATH; this one is a lockfile entry, so it is pinned by construction and CI cannot drift onto another jq without a visible diff. It is the only oracle in the repository with that property.

`from_slice` rather than `from_str` is deliberate. Several suite files are not valid UTF-8, and `from_str` would need them decoded before the oracle saw them — deciding the verdict outside the oracle. `from_slice` validates the encoding itself and rejects, which is the right answer, because RFC 8259 §8.1 requires UTF-8.

`validate_syntax_only` returns `None`, and that is the interesting answer rather than a shrug. The hook exists for toolchains that can run their parser without the checks a compiler applies afterwards; for JSON there is nothing afterwards, because the parse IS the value construction. That is not a limitation of serde_json, it is where JSON's implementation-defined zone lives, and it is why the grammar and its oracle disagree on 17 of the 35 `i_` files with neither of them wrong.

There is no second version family and no union: one RFC, one grammar, one oracle. `validate_current` therefore falls through to `validate`, which is correct rather than unfinished.

The oracle was also run in the direction the sweep cannot see. The sweep adjudicates only files the grammar FAILED, so a file the grammar accepts and the oracle rejects is invisible to it — and for this grammar that set is not empty in principle, since a number past f64 range, a half surrogate pair and nesting deeper than 128 are all accepted here and refused there. Run in both directions over both corpora: on npm's 1,683 files serde_json rejects exactly the 74 the grammar rejects and no others, and on the github corpus's 56,345 the two part company on 10, every one of them a leading UTF-8 BOM. That is the whole of the disagreement over 58,028 files.'''

[[deviations]]
what = '''
A leading UTF-8 byte order mark is accepted, and this grammar did not decide that. tree-sitter's input layer strips a BOM before the lexer runs, which is checkable rather than assumed: the same three bytes anywhere but the start of the file are an `UNEXPECTED 65279`. RFC 8259 §8.1 says an implementation MAY ignore a leading BOM, so accepting it conforms and serde_json rejecting it conforms.

It arrived as one suite fixture — `i_structure_UTF-8_BOM_empty_object` — and it is not a curiosity: it is the ONLY class in which this grammar and its oracle disagree over 58,028 files of real JSON, and it accounts for all 10 of those disagreements. Every one is a Windows-authored config file, mostly Minecraft add-on manifests. It is recorded because a reader looking for the rule that allows it will not find one in grammar.js, and because a future tree-sitter that stopped stripping BOMs would silently turn 10 passing files into failures with nothing in this crate having changed.'''

[[deviations]]
what = '''
Numbers are not range-checked, `\\u` escapes are not paired, and nesting is not depth-limited. All three are accepts-more-than-the-oracle and all three are deliberate: RFC 8259 leaves each to the implementation (§6, §8.2, §9) and each is a property of the VALUE rather than of the text. Enforcing surrogate pairing is the only one a grammar could express at all — it would mean a rule admitting `\\uD800` only when followed by a low surrogate — and it is refused because a lone surrogate is legal in a conforming JSON text that a `WTF-8` consumer reads fine, and rejecting it would put this grammar on one side of a question the standard declines to answer.'''

[[deviations]]
what = '''
Duplicate keys are accepted, with no node marking them. `{"a":1,"a":2}` parses as an object with two `pair` children and the tree keeps both, which is more than the oracle can say — serde_json's `Value` keeps the last and discards the first, as do CPython and jq. This is a deviation in the grammar's FAVOUR and it is recorded because it is the one measurable way the parse tree carries information the reference implementation destroys, which matters to anyone using the tree to lint or rewrite a document rather than to read a value out of it. RFC 8259 §4 calls the behaviour unpredictable and does not forbid the input.'''

[[deviations]]
what = '''
ACCEPTS-INVALID IS ONE CLASS AND IT IS THE BOM ABOVE. The entry exists to record that this is a measured claim rather than an unexamined one, and to name what did the measuring, because a sweep cannot: a sweep adjudicates only the files the grammar FAILED, so a file the grammar accepts and the oracle rejects is invisible to it.

Four independent checks look in that direction. 188 must-reject files written by someone with no knowledge of this grammar: 0 accepted. 30,110 corpus mutants: 0 widenings. 5,000 grammar derivations at complete alternative coverage: 0 widenings. And a whole-corpus cross-check of the grammar against the oracle in BOTH directions, over both corpora: on npm's 1,683 files they agree on every one (1,609 accepted by both, 74 rejected by both); on the github corpus's 56,345 they disagree on 10, and all 10 are a leading UTF-8 BOM.

The shapes that could have shown up here and did not are worth naming so the absence is legible. Three of them are accepted by this grammar and refused by the oracle, as the `i_` results show: a number past the range of an f64 such as `1e999`, a `\\u` escape that is half a surrogate pair, and nesting deeper than serde_json's limit of 128. In 58,028 files of real JSON, not one occurs. (Duplicate keys are not in that list: both sides accept them, which is its own deviation below.) That is a statement about what JSON people actually write as much as about the grammar.'''
